CSPInlineStyleViolation = Nastavenia stránky zablokovali použitie vloženého štýlu (%2$S), pretože porušuje nasledujúcu direktívu: “%1$S”
CSPROInlineStyleViolation = (Politika Report-Only) Nastavenia stránky by zablokovali použitie vloženého štýlu (%2$S), pretože porušuje nasledujúcu direktívu: “%1$S”
CSPInlineScriptViolation = Nastavenia stránky zablokovali spustenie vloženého skriptu (%2$S), pretože porušuje nasledujúcu direktívu: “%1$S”
CSPROInlineScriptViolation = (Politika Report-Only) Nastavenia stránky by zablokovali spustenie vloženého skriptu (%2$S), pretože porušuje nasledujúcu direktívu: “%1$S”
CSPEventHandlerScriptViolation = Nastavenia stránky zablokovali spustenie obsluhy udalosti (%2$S), pretože porušuje nasledujúcu direktívu: “%1$S”
CSPROEventHandlerScriptViolation = (Politika Report-Only) Nastavenia stránky by zablokovali spustenie obslužného programu udalosti (%2$S), pretože porušuje nasledujúcu direktívu: “%1$S”
CSPEvalScriptViolation = Nastavenia stránky zablokovali spustenie vyhodnotenia JavaScriptu (%2$S), pretože porušuje nasledujúcu direktívu: “%1$S” (chýba 'unsafe-eval')
CSPROEvalScriptViolation = (Politika Report-Only) Nastavenia stránky by zablokovali spustenie vyhodnotenia JavaScriptu (%2$S), pretože porušuje nasledujúcu direktívu: “%1$S” (chýba 'unsafe-eval')
CSPWasmEvalScriptViolation = Nastavenia stránky zablokovali spustenie WebAssembly (%2$S), pretože porušuje nasledujúcu direktívu: “%1$S” (chýba 'wasm-unsafe-eval' alebo 'unsafe-eval')
CSPROWasmEvalScriptViolation = (Politika Report-Only) Nastavenia stránky by zablokovali spustenie WebAssembly (%2$S), pretože porušuje nasledujúcu direktívu: “%1$S” (chýba 'wasm-unsafe-eval' alebo 'unsafe-eval')
CSPTrustedTypesPolicyViolation = Nastavenia stránky zablokovali vytvorenie zásady Trusted Types, pretože porušuje nasledujúcu smernicu: “%1$S“
CSPROTrustedTypesPolicyViolation = (Politika Report-Only) Nastavenia stránky by zablokovali vytvorenie zásady Trusted Types, pretože porušuje nasledujúcu smernicu: “%1$S“
CSPTrustedTypesSinkViolation = Nastavenia stránky zablokovali priradenie k injection sink, pretože porušuje nasledujúcu direktívu: “require-trusted-types-for ’script’“
CSPROTrustedTypesSinkViolation = (Politika Report-Only) Nastavenia stránky by zablokovali priradenie k injection sink, pretože porušuje nasledujúcu direktívu: “require-trusted-types-for ’script’“
CSPStyleViolation = Nastavenia stránky zablokovali použitie štýlu (%3$S) na %2$S, pretože porušuje nasledujúcu direktívu: “%1$S”
CSPROStyleViolation = (Politika Report-Only) Nastavenia stránky by zablokovali použitie štýlu (%3$S) na %2$S, pretože porušuje nasledujúcu direktívu: “%1$S”
CSPScriptViolation = Nastavenia stránky zablokovali spustenie skriptu (%3$S) na %2$S, pretože porušuje nasledujúcu direktívu: “%1$S”
CSPROScriptViolation = (Politika Report-Only) Nastavenia stránky by zablokovali spustenie skriptu (%3$S) na %2$S, pretože porušuje nasledujúcu direktívu: “%1$S”
CSPWorkerViolation = Nastavenia stránky zablokovali spustenie skriptu typu worker (%3$S) na %2$S, pretože porušuje nasledujúcu direktívu: “%1$S”
CSPROWorkerViolation = (Politika Report-Only) Nastavenia stránky by zablokovali spustenie skriptu typu worker (%3$S) na %2$S, pretože porušuje nasledujúcu direktívu: “%1$S”
CSPGenericViolation = Nastavenia stránky zablokovali načítanie zdroja (%3$S) z %2$S, pretože porušuje nasledujúcu direktívu: “%1$S”
CSPROGenericViolation = (Politika Report-Only) Nastavenia stránky by blokovali načítanie zdroja (%3$S) z %2$S, pretože porušuje nasledujúcu direktívu: “%1$S“
triedToSendReport = Pokus o odoslanie správy na neplatnú adresu: "%1$S"
tooManyReports = Zabránilo sa odoslaniu príliš veľkého počtu správ CSP v krátkom časovom období.
couldNotParseReportURI = Nebolo možné spracovať správu: %1$S
couldNotProcessUnknownDirective = Nebolo možné spracovať neznámu direktívu '%1$S'
ignoringUnknownOption = Ignoruje sa neznáma možnosť %1$S
ignoringDuplicateSrc = Ignoruje sa duplicitný zdroj %1$S
ignoringNonAsciiToken = Ignoruje sa direktíva ‘%1$S’ s iným než ASCII tokenom ‘%2$S’
ignoringSrcFromMetaCSP = Ignorovanie zdroja ‘%1$S’ (Nepodporovaný pri dodaní prostredníctvom prvku meta).
ignoringSrcWithinNonceOrHashDirective = Ignoruje sa “%1$S” v direktíve %2$S: je definovaný zdroj nonce-source alebo hash-source
ignoringScriptSrcForStrictDynamic = Ignoruje sa “%1$S” v direktíve %2$S: je definované ‘strict-dynamic’
ignoringStrictDynamic = Zdroj “%1$S” bol ignorovaný (podporované iba v script-src).
ignoringUnsafeEval = Ignorujú sa hodnoty ‘unsafe-eval’ alebo ‘wasm-unsafe-eval’ v direktíve “%1$S”.
strictDynamicButNoHashOrNonce = Kľúčové slovo ‘strict-dynamic’ obsiahnuté v “%1$S” s neplatným nonce a hash môže zablokovať načítanie všetkých skriptov
reportURInotHttpsOrHttp2 = URI správy (%1$S) musí používať HTTP alebo HTTPS.
reportURINorReportToNotInReportOnlyHeader = Táto stránka (%1$S) má politiku Report-Only bez direktív report-uri alebo report-to. CSP nebude blokovať jej porušenia, ani ich nebude hlásiť.
failedToParseUnrecognizedSource = Nepodarilo sa spracovať nerozpoznaný zdroj %1$S
upgradeInsecureRequest = Mení sa nebezpečná požiadavka '%1$S' na '%2$S'
ignoreSrcForDirective = Ingoruje sa src pre direktívu '%1$S'
hostNameMightBeKeyword = %1$S je interpretované ako názov servera, nie ako kľúčové slovo. Ak je to kľúčové slovo, použite ‘%2$S’ (v jednoduchých úvodzovkách).
notSupportingDirective = Nepodporovaná direktíva ‘%1$S’. Direktíva a jej hodnoty budú ignorované.
blockAllMixedContent = Blokuje sa nezabezpečená požiadavka '%1$S'.
ignoringDirectiveWithNoValues = Ignorovanie ‘%1$S‘ pre nedostatok parametrov.
ignoringInvalidGroupSyntax = Ignoruje sa skupina príkazov ‘%1$S’ s neplatným tokenom ‘%2$S’.
ignoringReportOnlyDirective = Ignorovanie direktívy sandobxu kvôli nastavenej politike report-only ‘%1$S’
IgnoringSrcBecauseOfDirective = Ignorovanie ‘%1$S’ kvôli direktíve ‘%2$S’.
IgnoringSourceWithinDirective = Ignorovanie zdroja “%1$S” (Nie je podporovaný v rámci ‘%2$S’).
obsoleteBlockAllMixedContent = Ignoruje sa ‘%1$S’, pretože inováciou spôsobu zobrazenia zmiešaného obsahu sa stala direktíva block-all-mixed-content zastaranou.
couldntParseInvalidSource = Nebolo možné spracovať neplatný zdroj %1$S
couldntParseInvalidHost = Nebolo možné spracovať neplatný server %1$S
couldntParsePort = Nebolo možné spracovať port v %1$S
duplicateDirective = Bola zistená duplicitná direktíva %1$S. Všetky inštancie mimo prvej budú ignorované.
couldntParseInvalidSandboxFlag = Nepodarilo sa spracovať neplatný príkaz sandboxu ‘%1$S’
invalidNumberOfTrustedTypesForDirectiveValues = Prijatý neplatný počet tokenov pre direktívu ‘require-trusted-types-for‘: %1$S; očakávaný 1
invalidRequireTrustedTypesForDirectiveValue = Prijatý neplatný token pre direktívu ‘require-trusted-types-for‘: %1$S; očaká sa ‘script‘
invalidTrustedTypesExpression = Prijatý neplatný token pre direktívu ‘trusted-types‘: %1$S
