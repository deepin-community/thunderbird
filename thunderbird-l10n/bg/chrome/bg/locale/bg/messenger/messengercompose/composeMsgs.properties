smtpHintAuthEncryptToPlainSsl = Изходящият (SMTP) %S сървър изглежда не поддържа шифровани пароли. Ако току-що сте направили профила, променете метода на удостоверяване в „Настройки на профила“ – 'Изходящ (SMTP) сървър' на „Обикновена парола“.
