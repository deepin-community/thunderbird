CSPInlineStyleViolation = La configuración de la página bloqueó la aplicación de un estilo en línea (%2$S) porque viola la siguiente directiva: “%1$S”
CSPROInlineStyleViolation = (Política Report-Only) La configuración de la página bloquearía la aplicación de un estilo en linea (%2$S) porque viola la siguiente directiva: “%1$S”
CSPInlineScriptViolation = La configuración de la página bloqueó la ejecución de un script en línea (%2$S) porque viola la siguiente directiva: “%1$S”
CSPROInlineScriptViolation = (Política Report-Only) La configuración de la página bloquearía la ejecución de un script en línea (%2$S) porque viola la siguiente directiva: “%1$S”
CSPEventHandlerScriptViolation = La configuración de la página bloqueó la ejecución de un controlador de eventos (%2$S) porque viola la siguiente directiva: “%1$S”
CSPROEventHandlerScriptViolation = (Política Report-Only) La configuración de la página bloquearía la ejecución de un controlador de eventos (%2$S) porque viola la siguiente directiva: “%1$S”
CSPEvalScriptViolation = La configuración de la página bloqueó la ejecución de JavaScript eval (%2$S) porque viola la siguiente directiva: “%1$S” (Falta 'unsafe-eval')
CSPROEvalScriptViolation = (Política Report-Only) La configuración de la página bloquearía la ejecución de JavaScript eval (%2$S) porque viola la siguiente directiva: “%1$S” (Falta 'unsafe-eval')
CSPWasmEvalScriptViolation = La configuración de la página bloqueó la ejecución de WebAssembly (%2$S) porque viola la siguiente directiva: “%1$S” (Falta 'wasm-unsafe-eval' o 'unsafe-eval')
CSPROWasmEvalScriptViolation = (Política Report-Only) La configuración de la página bloquearía la ejecución de WebAssembly (%2$S) porque viola la siguiente directiva: “%1$S” (Falta 'wasm-unsafe-eval' o 'unsafe-eval')
CSPTrustedTypesPolicyViolation = La configuración de la página bloqueó la creación de una política Trusted Types porque viola la siguiente directiva: “%1$S“
CSPROTrustedTypesPolicyViolation = (Política Report-Only) La configuración de la página bloquearía la creación de una política Trusted Types porque viola la siguiente directiva: “%1$S“
CSPTrustedTypesSinkViolation = La configuración de la página bloqueó la asignación a un injection sink porque viola la siguiente directiva: “require-trusted-types-for ’script’“
CSPROTrustedTypesSinkViolation = (Política Report-Only) La configuración de la página bloquearía la asignación a un injection sink porque viola la siguiente directiva: “require-trusted-types-for ’script’“
CSPStyleViolation = La configuración de la página bloqueó la aplicación de un estilo (%3$S) en %2$S porque viola la siguiente directiva: “%1$S”
CSPROStyleViolation = (Política Report-Only) La configuración de la página bloquearía la aplicación de un estilo (%3$S) en %2$S porque viola la siguiente directiva: “%1$S”
CSPScriptViolation = La configuración de la página bloqueó la ejecución de un script (%3$S) en %2$S porque viola la siguiente directiva: “%1$S”
CSPROScriptViolation = (Política Report-Only) La configuración de la página bloquearía la ejecución de un script (%3$S) en %2$S porque viola la siguiente directiva: “%1$S”
CSPWorkerViolation = La configuración de la página bloqueó la ejecución de un worker script (%3$S) en %2$S porque viola la siguiente directiva: “%1$S”
CSPROWorkerViolation = (Política Report-Only) La configuración de la página bloquearía la ejecución de un worker script (%3$S) en %2$S porque viola la siguiente directiva: “%1$S”
CSPGenericViolation = La configuración de la página bloqueó la carga de un recurso (%3$S) en %2$S porque viola la siguiente directiva: “%1$S”
CSPROGenericViolation = (Política Report-Only) La configuración de la página bloquearía la carga de un recurso (%3$S) en %2$S porque viola la siguiente directiva: “%1$S”
triedToSendReport = Se ha intentado enviar un informe a una URI no válida: "%1$S"
tooManyReports = Se ha evitado que se enviaran demasiados informes de CSP en un período corto de tiempo.
couldNotParseReportURI = No se puede interpretar la URI de informe: %1$S
couldNotProcessUnknownDirective = No se puede procesar la directiva desconocida '%1$S'
ignoringUnknownOption = Se ha ignorado la opción desconocida %1$S
ignoringDuplicateSrc = Ignorando origen duplicado %1$S
ignoringNonAsciiToken = Ignorando la directiva ‘%1$S’ con el token que no es ASCII ‘%2$S’
ignoringSrcFromMetaCSP = Origen '%1$S' ignorado (no se permite cuando se indica a través del elemento meta).
ignoringSrcWithinNonceOrHashDirective = Ignorando “%1$S” dentro de %2$S: se ha especificado nonce-source o hash-source
ignoringScriptSrcForStrictDynamic = Ignorando “%1$S” dentro de %2$S se ha especificado ‘strict-dynamic’
ignoringStrictDynamic = Ignorando fuente "%1$S" (solo se admite dentro de script-src).\u0020
ignoringUnsafeEval = Ignorando ‘unsafe-eval’ o ‘wasm-unsafe-eval’ dentro de “%1$S”.
strictDynamicButNoHashOrNonce = La palabra clave "strict-dynamic" dentro de "%1$S" sin nonce o hash válidos puede bloquear la carga de todos los scripts
reportURInotHttpsOrHttp2 = La URI de informe (%1$S) debe ser una URI HTTP o HTTPS.
reportURINorReportToNotInReportOnlyHeader = Este sitio (%1$S) tiene una política de solo informar sin una directiva de report-uri ni una directiva de report -to. CSP no bloqueará ni podrá informar las violaciones de esta política.
failedToParseUnrecognizedSource = No se puede interpretar la fuente no reconocida %1$S
upgradeInsecureRequest = Actualizando solicitud insegura '%1$S' para usar '%2$S'
ignoreSrcForDirective = Ignorando srcs en la directiva '%1$S'
hostNameMightBeKeyword = Interpretando %1$S como nombre de servidor, no como palabra clave. si pretendía que fuera una palabra clave, use '%2$S' (rodeado de comillas simples).
notSupportingDirective = La directiva '%1$S' no está implementada. Se ignorarán la directiva y los valores.
blockAllMixedContent = Bloqueando solicitud insegura '%1$S'.
ignoringDirectiveWithNoValues = Se ignora ‘%1$S‘ porque no contiene parámetros.
ignoringInvalidGroupSyntax = Ignorando el grupo de directivas report-to ‘%1$S’ con token inválido ‘%2$S’.
ignoringReportOnlyDirective = Se ignora la directiva de 'sandbox' al repartirse en la directiva solo informativa '%1$S'
IgnoringSrcBecauseOfDirective = Se ignora ‘%1$S’ por la directiva ‘%2$S’.
IgnoringSourceWithinDirective = Ignorar fuente “%1$S” (no compatible dentro de ‘%2$S’).
obsoleteBlockAllMixedContent = Ignorando ‘%1$S’ porque la actualización de visualización de contenido mezclado hace obsoleto block-all-mixed-content.
couldntParseInvalidSource = No se puede interpretar la fuente no válida %1$S
couldntParseInvalidHost = No se puede interpretar el host no válido %1$S
couldntParsePort = No se puede interpretar el puerto en %1$S
duplicateDirective = Detectadas directivas %1$S duplicadas. Todas las instancias, excepto la primera, serán ignoradas.
couldntParseInvalidSandboxFlag = No se ha podido interpretar el modificador '%1$S' no válido del 'sandbox'
invalidNumberOfTrustedTypesForDirectiveValues = Se ha recibido una cantidad no válida de tokens para la directiva ‘require-trusted-types-for‘: %1$S; esperado 1
invalidRequireTrustedTypesForDirectiveValue = Se ha recibido un token no válido para la directiva ‘require-trusted-types-for‘: %1$S; esperado ‘script‘
invalidTrustedTypesExpression = Se ha recibido un token no válido para la directiva ‘trusted-types‘: %1$S
CSPMessagePrefix = Content-Security-Policy: %S
