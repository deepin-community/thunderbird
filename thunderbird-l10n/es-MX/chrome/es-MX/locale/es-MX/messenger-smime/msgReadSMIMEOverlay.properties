ImapOnDemand = El mensaje mostrado ha sido firmado digitalmente, pero no todos sus adjuntos han sido descargados aún. Por lo tanto, la firma no puede ser validada. Haz clic en OK para descargar el mensaje completo y validar la firma.
CantDecryptTitle = %brand% no puede desencriptar este mensaje
CantDecryptBody = El remitente encriptó este mensaje para ti, usando uno de tus certificados digitales, sin embargo %brand% no fue capaz de encontrar este certificado y su llave privada correspondiente. <br> Soluciones posibles: <br><ul><li>Si tienes una tarjeta inteligente, por favor insértala ahora.<li>Si estás usando una computadora nueva o estás usando un nuevo perfil %brand%, tendrás que restaurar tu certificado y llave privada desde un respaldo. Los respaldos certificados usualmente terminan en ".p12".</ul>\u0020
