2000 = Metin dosyası (LDIF, .tab, .csv, .txt)
2001 = Adres defterini metin dosyasından içe aktar.  Desteklenenler arasında LDIF (.ldif, .ldi), tab ile ayrılmış (.tab, .txt) ve virgülle ile ayrılmış (.csv) dosya biçimleri bulunur.
2002 = Metin adres defteri
2003 = Aktarılmış adres defteri %S
2004 = Adres defteri içe aktarılırken hatalı parametreler verildi.
2005 = %S Adres defter dosyasına erişilirken hata oluştu.
2006 = %S adres defteri içe aktarılırken hata oluştu. Tüm adresler içe aktarılamamış olabilir.
