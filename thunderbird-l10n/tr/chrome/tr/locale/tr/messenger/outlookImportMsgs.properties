2000 = Outlook
2010 = Outlook e-posta, adres defterleri ve ayarları
2002 = Posta kutusu %S, %d ileti içe aktarıldı
2003 = Posta kutusuna hatalı parametreler verildi.
2004 = %S posta kutusu içe aktarılırken hata oluştu. Tüm iletiler içe aktarılmamış olabilir.
2005 = Outlook adres defteri
2006 = Aktarılmış adres defteri %S
2007 = Adres defteri içe aktarılırken hatalı parametreler verildi.
2008 = %S adres defteri dosyasına erişilirken hata oluştu.
2009 = %S adres defteri içe aktarılırken hata oluştu. Tüm adresler içe aktarılamamış olabilir.
