CSPEvalScriptViolation = Sayfa ayarları, aşağıdaki direktifi ihlal ettiği için bir JavaScript eval kullanımının (%2$S) yürütülmesini engelledi: “%1$S” ('unsafe-eval' eksik)
CSPROEvalScriptViolation = (Report-Only ilkesi) Sayfa ayarları, aşağıdaki direktifi ihlal ettiği için JavaScript eval kullanımının (%2$S) yürütülmesini engelleyecek: “%1$S” ('unsafe-eval' eksik)
CSPWasmEvalScriptViolation = Sayfa ayarları, aşağıdaki direktifi ihlal ettiği için WebAssembly’nin (%2$S) yürütülmesini engelledi: “%1$S” ('wasm-unsafe-eval' veya 'unsafe-eval' eksik)
CSPROWasmEvalScriptViolation = (Report-Only ilkesi) Sayfa ayarları, aşağıdaki direktifi ihlal ettiği için WebAssembly’nin (%2$S) yürütülmesini engelleyecek: “%1$S” ('wasm-unsafe-eval' veya 'unsafe-eval' eksik)
CSPTrustedTypesPolicyViolation = Sayfa ayarları, aşağıdaki direktifi ihlal ettiği için Trusted Types ilkesinin oluşturulmasını engelledi: “%1$S“
