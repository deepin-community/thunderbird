CSPInlineScriptViolation = Sayfa ayarları, aşağıdaki direktifi ihlal ettiği için bir satır içi betiğin (%2$S) yürütülmesini engelledi: “%1$S”
CSPROInlineScriptViolation = (Report-Only ilkesi) Sayfa ayarları, aşağıdaki direktifi ihlal ettiği için satır içi bir betiğin (%2$S) yürütülmesini engelleyecek: “%1$S”
