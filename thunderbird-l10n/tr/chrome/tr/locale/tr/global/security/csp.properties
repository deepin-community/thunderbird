CSPScriptViolation = Sayfa ayarları, aşağıdaki direktifi ihlal ettiği için %2$S kaynağındaki bir betiğin (%3$S) yürütülmesini engelledi: “%1$S”
CSPROScriptViolation = (Report-Only ilkesi) %2$S kaynağındaki bir betik (%3$S) şu direktifi ihlal ettiği için sayfa ayarları betiğin yürütülmesini engelleyecek: “%1$S”
CSPWorkerViolation = (Report-Only ilkesi) %2$S kaynağındaki bir worker betiği (%3$S) şu direktifi ihlal ettiği için sayfa ayarları betiğin yürütülmesini engelledi: “%1$S”
CSPROWorkerViolation = (Report-Only policy) The page’s settings would block a worker script (%3$S) at %2$S from being executed because it violates the following directive: “%1$S”
CSPGenericViolation = The page’s settings blocked the loading of a resource (%3$S) at %2$S because it violates the following directive: “%1$S”
