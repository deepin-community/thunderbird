CSPInlineStyleViolation = Налаштування сторінки заблокували застосування вбудованого стилю (%2$S), оскільки він порушує таку директиву: “%1$S”
CSPROInlineStyleViolation = (Політика Report-Only) Налаштування сторінки блокуватимуть застосування вбудованого стилю (%2$S), оскільки він порушує таку директиву: “%1$S”
CSPInlineScriptViolation = Налаштування сторінки заблокували виконання вбудованого скрипту (%2$S), оскільки він порушує таку директиву: “%1$S”
CSPROInlineScriptViolation = (Політика Report-Only) Налаштування сторінки блокуватимуть виконання вбудованого скрипту (%2$S), оскільки він порушує таку директиву: “%1$S”
CSPEventHandlerScriptViolation = Налаштування сторінки заблокували виконання обробника подій (%2$S), оскільки він порушує таку директиву: “%1$S”
CSPROEventHandlerScriptViolation = (Політика Report-Only) Налаштування сторінки блокуватимуть виконання обробника подій (%2$S), оскільки він порушує таку директиву: “%1$S”
CSPEvalScriptViolation = Налаштування сторінки заблокували виконання JavaScript eval (%2$S), оскільки він порушує таку директиву: “%1$S” (відсутнє 'unsafe-eval')
CSPROEvalScriptViolation = (Політика Report-Only) Налаштування сторінки блокуватимуть виконання JavaScript eval (%2$S), оскільки він порушує таку директиву: “%1$S” (відсутнє 'unsafe-eval')
CSPWasmEvalScriptViolation = Налаштування сторінки заблокували виконання WebAssembly (%2$S), оскільки він порушує таку директиву: “%1$S” (відсутнє 'wasm-unsafe-eval' або 'unsafe-eval')
CSPROWasmEvalScriptViolation = (Політика Report-Only) Налаштування сторінки блокуватимуть виконання WebAssembly (%2$S), оскільки він порушує таку директиву: “%1$S” (відсутнє 'wasm-unsafe-eval' або 'unsafe-eval')
CSPTrustedTypesPolicyViolation = Налаштування сторінки заблокували створення політики Trusted Types, оскільки вона порушує таку директиву: “%1$S“
CSPROTrustedTypesPolicyViolation = (Політика Report-Only) Налаштування сторінки блокуватимуть створення політики Trusted Types, оскільки вона порушує таку директиву: “%1$S“
CSPTrustedTypesSinkViolation = Налаштування сторінки заблокували призначення приймачу ін'єкцій, оскільки це порушує таку директиву: “require-trusted-types-for ’script’“
CSPROTrustedTypesSinkViolation = (Політика Report-Only) Налаштування сторінки блокуватимуть призначення приймачу ін'єкцій, оскільки це порушує таку директиву: “require-trusted-types-for ’script’“
CSPStyleViolation = Налаштування сторінки заблокували застосування стилю (%3$S) на %2$S, оскільки він порушує таку директиву: “%1$S”
CSPROStyleViolation = (Політика Report-Only) Налаштування сторінки блокуватимуть застосування стилю (%3$S) на %2$S, оскільки він порушує таку директиву: “%1$S”
CSPScriptViolation = Налаштування сторінки заблокували виконання скрипту (%3$S) на %2$S, оскільки він порушує таку директиву: “%1$S”
CSPROScriptViolation = (Політика Report-Only) Налаштування сторінки блокуватимуть виконання скрипту (%3$S) на %2$S, оскільки він порушує таку директиву: “%1$S”
CSPWorkerViolation = Налаштування сторінки заблокували виконання скрипту worker (%3$S) на %2$S, оскільки він порушує таку директиву: “%1$S”
CSPROWorkerViolation = (Політика Report-Only) Налаштування сторінки блокуватимуть виконання скрипту worker (%3$S) на %2$S, оскільки він порушує таку директиву: “%1$S”
CSPGenericViolation = Налаштування сторінки заблокували завантаження ресурсу (%3$S) на %2$S, оскільки він порушує таку директиву: “%1$S”
CSPROGenericViolation = (Політика Report-Only) Налаштування сторінки блокуватимуть завантаження ресурсу (%3$S) на %2$S, оскільки він порушує таку директиву: “%1$S”
triedToSendReport = Спроба відправлення звіту на некоректний URI: "%1$S"
tooManyReports = Запобігати надсиланню завеликої кількості звітів CSP впродовж короткого проміжку часу.
couldNotParseReportURI = невдалий аналіз звіту URI: %1$S
couldNotProcessUnknownDirective = Не вдалося обробити невідому директиву '%1$S'
ignoringUnknownOption = Ігнорування невідомого параметра %1$S
ignoringDuplicateSrc = Ігнорування дублікату джерела %1$S
ignoringNonAsciiToken = Ігнорування директиви ‘%1$S’ з не-ASCII токеном ‘%2$S’
ignoringSrcFromMetaCSP = Ігнорування джерела '%1$S' (Не підтримується, коли доставлено через мета-елемент).
ignoringSrcWithinNonceOrHashDirective = Ігнорування “%1$S” в межах %2$S: вказано nonce-source або hash-source
ignoringScriptSrcForStrictDynamic = Ігнорування “%1$S” в межах %2$S: вказано ‘strict-dynamic’
ignoringStrictDynamic = Ігнорування джерела “%1$S” (Підтримується лише в межах script-src).
ignoringUnsafeEval = Ігнорування ‘unsafe-eval’ або ‘wasm-unsafe-eval’ всередині “%1$S”.
strictDynamicButNoHashOrNonce = Ключове слово ‘strict-dynamic’ в межах “%1$S” з недійсним поточним часом або хешем могли заблокувати завантаження всіх скриптів
reportURInotHttpsOrHttp2 = URI звіту (%1$S) повинен бути HTTP чи HTTPS URI.
reportURINorReportToNotInReportOnlyHeader = Цей сайт (%1$S) має політику Report-Only без директиви report-uri або report-to. CSP не блокуватиме й не може повідомити про порушення цієї політики.
failedToParseUnrecognizedSource = Невдалий аналіз незнайомого ресурсу %1$S
upgradeInsecureRequest = Оновлення незахищеного запиту '%1$S' використовувати '%2$S'
ignoreSrcForDirective = Ігнорування srcs для директиви '%1$S'
hostNameMightBeKeyword = %1$S означає ім'я сервера, а не ключове слово. Якщо ви хотіли, щоб це було ключове слово, використайте ‘%2$S’ (в одинарних лапках).
notSupportingDirective = Директива ‘%1$S’ не підтримується. Директиви та значення ігноруватимуться.
blockAllMixedContent = Блокування небезпечного запиту ‘%1$S’.
ignoringDirectiveWithNoValues = Ігнорування ‘%1$S‘ , оскільки вона не містить жодних параметрів.
ignoringInvalidGroupSyntax = Ігнорування групи директив report-to ‘%1$S’ з недійсним токеном ‘%2$S’.
ignoringReportOnlyDirective = Ігнорування директиви пісочниці за доставлення в політиці report-only ‘%1$S’
IgnoringSrcBecauseOfDirective = Ігнорування ‘%1$S’ у зв'язку з директивою ‘%2$S’.
IgnoringSourceWithinDirective = Ігнорування джерела “%1$S” (Не підтримується в межах ‘%2$S’).
obsoleteBlockAllMixedContent = Ігнорування ‘%1$S’, оскільки оновлення показу змішаного вмісту робить block-all-mixed-content застарілим.
couldntParseInvalidSource = Не вдається проаналізувати некоректне джерело %1$S
couldntParseInvalidHost = Не вдається проаналізувати некоректний хост %1$S
couldntParsePort = Не вдається проаналізувати порт у %1$S
duplicateDirective = Виявлено дублікати директиви %1$S.  Усі випадки, окрім першого будуть знехтувані.
couldntParseInvalidSandboxFlag = Не вдається проаналізувати некоректний прапор пісочниці ‘%1$S’
invalidNumberOfTrustedTypesForDirectiveValues = Отримано недійсну кількість токенів для директиви ‘require-trusted-types-for‘: %1$S; очікується 1
invalidRequireTrustedTypesForDirectiveValue = Отримано недійсний токен для директиви ‘require-trusted-types-for‘: %1$S; очікується ‘script‘
invalidTrustedTypesExpression = Отримано недійсний токен для директиви ‘trusted-types‘: %1$S
CSPMessagePrefix = Content-Security-Policy: %S
