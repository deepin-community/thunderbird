imapAuthChangeEncryptToPlainSSL = Nid yw gweinydd IMAP %S i weld yn cynnal cyfrineiriau wedi eu hamgryptio. Os ydych newydd osod y cyfrif, ceisiwch newid i 'Cyfrinair arferol' fel y 'Dull Dilysu' yn 'Gosodiadau Cyfrifon | Gosodiadau Gweinyddion'. Os oedd arfer a gweithio a nawr yn methu'n sydyn, cysylltwch â'ch gweinyddwr e-bost neu eich darparwr.
imapAuthChangePlainToEncrypt = Nid yw gweinydd IMAP %S yn caniatáu cyfrineiriau testun plaen. Ceisiwch newid i 'Cyfrinair wedi ei hamgryptio' fel y 'Dull Dilysu' yn 'Gosodiadau Cyfrifon | Gosodiadau gweinyddion'.
