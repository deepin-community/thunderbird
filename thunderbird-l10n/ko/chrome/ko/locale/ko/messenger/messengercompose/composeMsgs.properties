smtpTooManyRecipients = 받는 사람 수의 한도를 초과하여 메시지가 전송되지 않았습니다. 서버 응답: %s.
smtpClientid = 보내는 서버(SMTP)가 CLIENTID 명령에서 오류를 감지했습니다. 메시지가 전송되지 않았습니다. 서버 응답: %s
