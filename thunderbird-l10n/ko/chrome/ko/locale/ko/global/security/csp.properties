CSPInlineStyleViolation = 다음 지시자를 위반하기 때문에 페이지 설정에서 인라인 스타일(%2$S)이 적용되지 않도록 차단했습니다: "%1$S"
CSPROInlineStyleViolation = (보고 전용 정책) 다음 지시자를 위반하기 때문에 페이지 설정에서 인라인 스타일(%2$S)이 적용되지 않도록 차단합니다: "%1$S"
CSPInlineScriptViolation = 다음 지시자를 위반하기 때문에 페이지 설정에서 인라인 스크립트(%2$S)가 실행되지 않도록 차단했습니다: "%1$S"
CSPROInlineScriptViolation = (보고 전용 정책) 다음 지시자를 위반하기 때문에 페이지 설정에서 인라인 스크립트(%2$S)가 실행되지 않도록 차단합니다: "%1$S"
CSPEventHandlerScriptViolation = 다음 지시자를 위반하기 때문에 페이지 설정에서 이벤트 핸들러(%2$S)가 실행되지 않도록 차단했습니다: "%1$S"
CSPROEventHandlerScriptViolation = (보고 전용 정책) 다음 지시자를 위반하기 때문에 페이지 설정에서 이벤트 핸들러(%2$S)가 실행되지 않도록 차단합니다: "%1$S"
CSPEvalScriptViolation = 다음 지시자를 위반하기 때문에 페이지 설정에서 JavaScript 평가(%2$S)가 실행되지 않도록 차단했습니다: “%1$S” ('unsafe-eval' 누락)
CSPROEvalScriptViolation = (보고 전용 정책) 다음 지시자를 위반하기 때문에 페이지 설정에서 JavaScript 평가(%2$S)가 실행되지 않도록 차단합니다: “%1$S” ('unsafe-eval' 누락)
CSPWasmEvalScriptViolation = 다음 지시자를 위반했기 때문에 페이지 설정에서 WebAssembly(%2$S)의 실행이 차단되었습니다: “%1$S” ('wasm-unsafe-eval' 또는 'unsafe-eval' 누락)
CSPROWasmEvalScriptViolation = (보고 전용 정책) 다음 지시자를 위반하기 때문에 페이지 설정으로 인해 WebAssembly(%2$S)가 실행되지 않습니다: "%1$S" ('wasm-unsafe-eval' 또는 'unsafe-eval' 누락)
CSPTrustedTypesPolicyViolation = 다음 지시자를 위반하기 때문에 페이지 설정에서 신뢰할 수 있는 유형 정책 생성이 차단되었습니다: “%1$S“
CSPROTrustedTypesPolicyViolation = (보고 전용 정책) 다음 지시자를 위반하기 때문에 페이지 설정에서 신뢰할 수 있는 유형 정책 생성이 차단됩니다: “%1$S“
CSPTrustedTypesSinkViolation = 다음 지시자를 위반하기 때문에 페이지 설정에서 주입 싱크에 할당이 차단되었습니다: "require-trusted-types-for 'script'"
CSPROTrustedTypesSinkViolation = (보고 전용 정책) 다음 지시자를 위반하기 때문에 페이지 설정에서 주입 싱크에 할당하는 것을 차단합니다: "require-trusted-types-for 'script'"
CSPStyleViolation = 다음 지시자를 위반하기 때문에 페이지 설정에서 %2$S의 스타일(%3$S)이 적용되지 않도록 차단했습니다: "%1$S"
CSPROStyleViolation = (보고 전용 정책) 다음 지시자를 위반하므로 페이지 설정에서 %2$S의 스타일(%3$S)이 적용되지 않도록 차단합니다: "%1$S"
CSPScriptViolation = 다음 지시자를 위반하기 때문에 페이지 설정에서 %2$S의 스크립트(%3$S)가 실행되지 않도록 차단했습니다: "%1$S"
CSPROScriptViolation = (보고 전용 정책) 다음 지시자를 위반하므로 페이지 설정에 따라 %2$S의 스크립트(%3$S)의 실행이 차단됩니다: "%1$S"
CSPWorkerViolation = 다음 지시자를 위반하기 때문에 페이지 설정에서 %2$S의 작업자 스크립트(%3$S)가 실행되지 않도록 차단했습니다: "%1$S"
CSPROWorkerViolation = (보고 전용 정책) 페이지 설정에 따라 %2$S의 작업자 스크립트(%3$S)가 "%1$S" 지시자를 위반하므로 실행이 차단됩니다.
CSPGenericViolation = 다음 지시자를 위반했기 때문에 페이지 설정이 %2$S에서 리소스(%3$S) 로드를 차단했습니다: "%1$S"
CSPROGenericViolation = (보고 전용 정책) 다음 지시자를 위반하기 때문에 페이지 설정으로 인해 %2$S에서 리소스(%3$S) 로드가 차단됩니다: "%1$S"
triedToSendReport = 보고서를 보낼 URI가 유효하지 않음: "%1$S"
tooManyReports = 짧은 시간 내에 너무 많은 CSP 보고서가 전송되는 것을 방지했습니다.
couldNotParseReportURI = 보고서 URI를 파싱할 수 없음: %1$S
couldNotProcessUnknownDirective = 알 수 없는 지시자 '%1$S'를 처리하지 못함
ignoringUnknownOption = 알 수 없는 옵션 %1$S 무시
ignoringDuplicateSrc = 중복된 출처 %1$S 무시
ignoringNonAsciiToken = ASCII가 아닌 ‘%2$S’ 토큰이 있는 지시자 ‘%1$S’ 무시
ignoringSrcFromMetaCSP = '%1$S' 소스 무시(메타 요소로 전달되면 지원하지 않음).
ignoringSrcWithinNonceOrHashDirective = %2$S 안의 "%1$S" 무시함: nonce-source나 hash-source 명시됨
ignoringScriptSrcForStrictDynamic = %2$S 안의 “%1$S” 무시함: ‘strict-dynamic’이 명시됨
ignoringStrictDynamic = “%1$S” 소스 무시함(script-src 안에서만 지원됨).
ignoringUnsafeEval = “%1$S” 안의 ‘unsafe-eval’ 또는 ‘wasm-unsafe-eval’을 무시합니다.
strictDynamicButNoHashOrNonce = 유효하지 않은 nonce나 hash가 없는 “%1$S” 안의 ‘strict-dynamic’ 키워드는 모든 스크립트 로드를 막을 수 있음
reportURInotHttpsOrHttp2 = 보고서 URI (%1$S)는 HTTP나 HTTPS URI이어야 합니다.
reportURINorReportToNotInReportOnlyHeader = 이 사이트(%1$S)에는 보고-uri 지시문이나 보고 대상 지시문이 없는 보고 전용 정책이 있습니다. CSP는 이 정책 위반을 차단하거나 보고할 수 없습니다.
failedToParseUnrecognizedSource = 알 수 없는 소스 %1$S 파싱 실패
upgradeInsecureRequest = 안전하지 않은 요청 '%1$S'이(가) '%2$S'을(를) 사용하도록 업그레이드
ignoreSrcForDirective = ‘%1$S’ 지시자에 대한 소스를 무시
hostNameMightBeKeyword = %1$S를 키워드가 아닌 호스트명으로 해석했습니다. 키워드로 사용한 것이라면 대신 '%2$S'를 사용하세요 (홑따옴표로 감쌈).
notSupportingDirective = 지원하지 않는 '%1$S' 지시자 입니다. 지시자와 값이 무시됩니다.
blockAllMixedContent = 안전하지 않은 '%1$S' 요청을 차단합니다.
ignoringDirectiveWithNoValues = 매개 변수를 포함하고 있지 않아서 ‘%1$S‘ 사이트를 무시합니다.
ignoringInvalidGroupSyntax = 유효하지 않은 ‘%2$S’ 토큰을 가진 ‘%1$S’ 보고 지시자 그룹을 무시합니다.
ignoringReportOnlyDirective = 보고서 유일 정책 ‘%1$S’ 전송시 샌드박스 지시자 무시
IgnoringSrcBecauseOfDirective = ‘%2$S’ 지시자로 인해 ‘%1$S’를 무시합니다.
IgnoringSourceWithinDirective = “%1$S” 소스 무시함 (‘%2$S’에서 지원되지 않음).
obsoleteBlockAllMixedContent = 혼합 콘텐츠 표시 업그레이드로 인해 block-all-mixed-content가 더 이상 사용되지 않으므로 ‘%1$S’를 무시합니다.
couldntParseInvalidSource = 유효하지 않은 소스 %1$S를 파싱할 수 없음
couldntParseInvalidHost = 유효하지 않은 호스트 %1$S를 파싱할 수 없음
couldntParsePort = %1$S에서 포트를 파싱할 수 없음
duplicateDirective = 중복된 %1$S 지시자가 감지되었습니다. 첫 인스턴스 말고는 모두 무시될 것입니다.
couldntParseInvalidSandboxFlag = 유효하지 않은 샌드박스 플래그 ‘%1$S’를 붙일 수 없음
invalidNumberOfTrustedTypesForDirectiveValues = 'require-trusted-types-for' 지시자에 대해 잘못된 수의 토큰을 받음: %1$S; 예상 1
invalidRequireTrustedTypesForDirectiveValue = 'require-trusted-types-for' 지시자에 대해 잘못된 토큰을 받음: %1$S; 예상 'script'
invalidTrustedTypesExpression = 'trusted-types' 지시자에 대해 잘못된 토큰을 받음: %1$S
CSPMessagePrefix = Content-Security-Policy: %S
