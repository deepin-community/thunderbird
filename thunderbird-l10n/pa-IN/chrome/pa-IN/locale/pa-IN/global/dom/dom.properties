UseOfReleaseEventsWarning = releaseEvents() ਦੀ ਵਰਤੋਂ ਬਰਤਰਫ਼ ਕੀਤੀ ਗਈ। ਆਪਣੇ ਕੋਡ ਨੂੰ ਅੱਪਗਰੇਡ ਕਰਨ ਲਈ,  DOM 2 removeEventListener() ਢੰਗ ਨੂੰ ਵਰਤੋਂ। ਹੋਰ ਜਾਣਕਾਰੀ ਲਈ ਵੇਖੋ http://developer.mozilla.org/en/docs/DOM:element.removeEventListener
SyncXMLHttpRequestDeprecatedWarning = Synchronous XMLHttpRequest on the main thread is deprecated because of its detrimental effects to the end user’s experience. For more help https://xhr.spec.whatwg.org/#sync-warning
Window_Cc_ontrollersWarning = window.controllers/Controllers is deprecated. Do not use it for UA detection.
ImportXULIntoContentWarning = ਸਮੱਗਰੀ ਦਸਤਾਵੇਜ਼ ਵਿੱਚ XUL ਨੋਡਾਂ ਨੂੰ ਬਰਤਰਫ਼ ਕੀਤਾ ਗਿਆ ਹੈ। ਇਹ ਸਹੂਲਤ ਨੂੰ ਛੇਤੀ ਹੀ ਹਟਾ ਦਿੱਤਾ ਜਾਵੇਗਾ।
IndexedDBTransactionAbortNavigation = IndexedDB ਟਰਾਂਸੈਕਸ਼ਨ, ਜੋ ਕਿ ਹਾਲੇ ਪੂਰੀ ਨਹੀਂ ਹੋਈ ਸੀ, ਨੂੰ ਸਫ਼ਾ ਨੇਵੀਗੇਸ਼ਨ ਦੇ ਕਰਕੇ ਅਧੂਰਾ ਛੱਡਿਆ
