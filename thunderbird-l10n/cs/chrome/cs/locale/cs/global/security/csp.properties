CSPInlineStyleViolation = Nastavení stránky zablokovalo použití vloženého stylu (%2$S), protože porušuje následující direktivu: “%1$S”
CSPROInlineStyleViolation = (Politika Report-Only) Tato nastavení stránky zablokuje použití vloženého stylu (%2$S), protože porušuje direktivu „%1$S“
CSPInlineScriptViolation = Nastavení stránky zablokovalo spuštění vloženého skriptu (%2$S), protože porušuje následující direktivu: “%1$S”
CSPROInlineScriptViolation = (Politika Report-Only) Tato nastavení zablokuje provedení vloženého skriptu (%2$S), protože porušuje následující direktivu: „%1$S“
CSPEventHandlerScriptViolation = Nastavení stránky zablokovalo provedení události (%2$S), která porušuje direktivu „%1$S“
CSPROEventHandlerScriptViolation = (Politika Report-Only) Tato nastavení stránky zablokuje provedení události (%2$S), protože porušuje následující direktivu: „%1$S“
CSPEvalScriptViolation = Nastavení stránky zablokovalo provedení eval JavaScriptu (%2$S), protože porušuje následující direktivu: "%1$S" (chybí 'unsafe-eval').
CSPROEvalScriptViolation = (Politika Report-Only) Tato nastavení stránky zablokuje spuštění prvku „%2$S“ v JavaScriptu, protože porušuje následující direktivu: „%1$S“ (chybějící „unsafe-eval“)
CSPWasmEvalScriptViolation = Nastavení stránky zablokovalo spuštění WebAssembly (%2$S), protože porušuje direktivu „%1$S“ (chybí 'wasm-unsafe-eval' nebo 'unsafe-eval')
CSPROWasmEvalScriptViolation = (Politika Report-Only) Nastavení stránky zablokuje spuštění WebAssembly (%2$S), protože porušuje direktivu „%1$S“ (chybějící 'wasm-unsafe-eval' nebo 'unsafe-eval')
CSPTrustedTypesPolicyViolation = Nastavení stránky zablokovalo vytvoření zásady Trusted Types, protože porušuje následující direktivu: “%1$S“
CSPROTrustedTypesPolicyViolation = (Politika Report-Only) Nastavení stránky by zablokovalo vytvoření zásady Trusted Types, protože porušuje následující direktivu: “%1$S“
CSPTrustedTypesSinkViolation = Nastavení stránky zablokovalo přiřazení do injection sink, protože porušuje následující direktivu: “require-trusted-types-for ’script’“
CSPROTrustedTypesSinkViolation = (Politika Report-Only) Nastavení stránky by zablokovalo přiřazení do injection sink, protože porušuje následující direktivu: “require-trusted-types-for ’script’“
CSPStyleViolation = Nastavení stránky zablokovalo použití stylu (%3$S) na %2$S, protože porušuje následující direktivu: „%1$S“
CSPROStyleViolation = (Politika Report-Only) Tato nastavení stránky zablokuje použití stylu (%3$S) na %2$S, protože porušuje následující direktivu: „%1$S“
CSPScriptViolation = Nastavení stránky zablokovalo provedení skriptu (%3$S) na %2$S, protože porušuje direktivu „%1$S“
CSPROScriptViolation = (Politika Report-Only) Tato nastavení zablokuje provedení skriptu (%3$S) na %2$S, protože porušuje následující direktivu: „%1$S“
CSPWorkerViolation = Nastavení stránky zablokovalo provedení skriptu typu worker (%3$S) na %2$S, protože porušuje následující direktivu: “%1$S”
CSPROWorkerViolation = (Politika Report-Only) Tato nastavení zablokuje provedení pracovního skriptu (%3$S) na adrese %2$S, protože porušuje direktivu „%1$S“
CSPGenericViolation = Nastavení stránky zablokovalo načítání zdroje (%3$S) v %2$S, protože porušuje direktivu „%1$S“
CSPROGenericViolation = (Politika Report-Only) Tato nastavení stránky zablokuje načítání zdroje (%3$S) na %2$S, protože porušuje následující direktivu: „%1$S“
triedToSendReport = URI reportu je neplatná: „%1$S“
tooManyReports = Zabránilo se odeslání příliš mnoha CSP zpráv v krátkém časovém období.
couldNotParseReportURI = Nelze naparsovat URI reportu: %1$S
couldNotProcessUnknownDirective = Nelze provést neznámou direktivu „%1$S“
ignoringUnknownOption = Neznámá možnost „%1$S“ byla ignorována
ignoringDuplicateSrc = Duplicitní zdroje %1$S byly ignorovány
ignoringNonAsciiToken = Ignoruje se direktiva ‘%1$S’ s jiným než ASCII tokenem ‘%2$S’
ignoringSrcFromMetaCSP = Zdroj „%1$S“ byl ignorován (není podporován prostřednictvím prvku meta).
ignoringSrcWithinNonceOrHashDirective = Ignorování “%1$S” uvnitř %2$S: je definován zdroj nonce-source či hash-source
ignoringScriptSrcForStrictDynamic = Ignorování “%1$S” uvnitř %2$S: specifikován ‘strict-dynamic’
ignoringStrictDynamic = Zdroj „%1$S“ byl ignorován (podporován pouze ve script-src).
ignoringUnsafeEval = Ignorují se hodnoty ‘unsafe-eval’ nebo ‘wasm-unsafe-eval’ v direktivě “%1$S”.
strictDynamicButNoHashOrNonce = Klíčové slovo ‘strict-dynamic’ obsažené v „%1$S“ s neplatným nonce a hash může zablokovat načítání všech skriptů
reportURInotHttpsOrHttp2 = URI reportu (%1$S) by mělo být HTTP nebo HTTPS URI.
reportURINorReportToNotInReportOnlyHeader = Tato stránka (%1$S) má politiku Report-Only, ale bez direktivy report-uri či report-to directive. SCP nebude blokovat její porušení a ani ji nebude reportovat.
failedToParseUnrecognizedSource = Chyba při parsování nerozpoznaného zdroje %1$S
upgradeInsecureRequest = Aktualizace nezabezpečených požadavků „%1$S“ na „%2$S“
ignoreSrcForDirective = Hodnota srcs pro direktivu „%1$S“ byla ignorována
hostNameMightBeKeyword = %1$S interpretováno jako host, nikoliv klíčové slovo. Pokud se jedná o klíčové slovo, použijte „%2$S“ (obaleno do jednoduchých uvozovek).
notSupportingDirective = Nepodporovaná direktiva „%1$S“. Direktiva a hodnoty budou ignorovány.
blockAllMixedContent = Blokování nebezpečné žádosti „%1$S“.
ignoringDirectiveWithNoValues = Direktiva „%1$S“ byla pro nedostatek argumentů ignorována.
ignoringInvalidGroupSyntax = Ignorování skupiny direktiv report-to ‘%1$S’ s neplatným tokenem ‘%2$S’.
ignoringReportOnlyDirective = Ignorování direktivy sandboxu kvůli nastavené politice report-only ‘%1$S’
IgnoringSrcBecauseOfDirective = Direktiva „%1$S“ byl ignorována, protože je definována direktiva „%2$S“.
IgnoringSourceWithinDirective = Zdroj „%1$S“ ignorován (uvnitř „%2$S“ není podporován).
obsoleteBlockAllMixedContent = Ignoruje se ‘%1$S’, protože kvůli aktualizaci zobrazení smíšeného obsahu se stala direktiva block-all-mixed-content zastaralou.
couldntParseInvalidSource = Nepodařilo se naparsovat neplatný zdroj %1$S
couldntParseInvalidHost = Nepodařilo se naparsovat název serveru %1$S
couldntParsePort = Nepodařilo se naparsovat port v %1$S
duplicateDirective = Zaznamenána duplicitní direktiva %1$S. Všechny její výskyty mimo prvního budou ignorovány.
couldntParseInvalidSandboxFlag = Nepodařilo se neplatný příznak sandboxu ‘%1$S’
invalidNumberOfTrustedTypesForDirectiveValues = Přijat chybný počet tokenů pro direktivu ‘require-trusted-types-for‘: %1$S; očekáváno 1
invalidRequireTrustedTypesForDirectiveValue = Přijat neplatný token pro direktivu ‘require-trusted-types-for‘: %1$S; očekáváno ‘script‘
invalidTrustedTypesExpression = Přijat neplatný token pro direktivu ‘trusted-types‘: %1$S
CSPMessagePrefix = Content-Security-Policy: %S
