ImapOnDemand = Ri rutzijol nik'ut kematz'ib'il xjuch', pa man ronojel ta ri taq ru taqoj eqasan. Ruma ri' toq man okel ta ri rujuch'. Tapitz'a' pa ÜTZ richin naqasaj tz'aqät rutzijol chuqa' richin najikib'a' ri juch'.
CantDecryptTitle = %brand% man nitikïr ta nretamaj rusik'ixik re rutzijol re'
CantDecryptBody = Ri taqonel xrewaj rusik'ixik re rutzijol re' akuchi' xrokisaj jun kematz'ib'il iqitzijib'äl, po ri %brand% man xrïl ta ri iqitzijib'äl chuqa' ri ichinan ewan rutzij. <br> Jujun rusolik: <br><ul><li>we k'o jun smartcard awik'in, tanima' wakami. <li>We nawokisaj jun k'ak'a' kematz'ib', o we nawokisaj jun k'ak'a' ruwäch ab'i' richin %brand% k'o chi ye'achojmirisaj ri taq awiqitzijib'al chuqa' ri ichinan ewan tzij rik'in jun backup. Ri kiqitzijib'al backups jantape' nikik'isb'ej rik'in ".p12".</ul>\u0020
