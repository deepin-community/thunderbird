RepostFormData = Re ruxaq k'amaya'l re' tajin nitaq pa jun chik ochochib'äl. ¿La nawajo' ye'atäch chik el ri taq tzij xe'atz'ib'aj pa ri runojwuj ri k'ak'a' ochochib'äl?
