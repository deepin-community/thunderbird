ServiceWorkerRegisterMimeTypeError2 = Չհաջողվեց գրանցել/թարմացնել ServiceWorker֊ը ‘%1$S’֊ի շրջանակի համար․Վատ բովանդակություն․‘%2$S’֊ի համար ստացված ‘%3$S’։ Պետք լինի JavaScript MIME տեսակ։
