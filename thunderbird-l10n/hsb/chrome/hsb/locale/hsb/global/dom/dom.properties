OnBeforeUnloadTitle = Sće wěsty?
OnBeforeUnloadMessage2 = Tuta strona prosy was, zo byšće wobkrućił, zo chceće stronu wopušćić - informacije, kotrež sće zapodał, so snano njeskładuja.
OnBeforeUnloadStayButton = Na stronje wostać
OnBeforeUnloadLeaveButton = Stronu wopušćić
OnBeforeUnloadPDFjsTitle = PDF do kónčenja składować?
OnBeforeUnloadPDFjsMessage = Składujće tutón dokument, zo byšće wobešoł, zo so waše změny zhubja.
OnBeforeUnloadAboutNewProfileTitle = Wopušćić, bjeztoho zo byšće profilej mjeno dał?
OnBeforeUnloadAboutNewProfileMessage = Jeli nětko wopušćeće, tutón profil mjeno %S dóstanje. Móžeće to pozdźišo změnić.
