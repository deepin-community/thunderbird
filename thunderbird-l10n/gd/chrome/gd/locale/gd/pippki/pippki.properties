getPKCS12FilePasswordMessage = Cuir a-steach am facal-faire a chleachd thu gus lethbhreac-glèidhidh an teisteanais seo a chrioptachadh:
pageInfo_NoEncryption = Chan eil an ceangal air a chrioptachadh
