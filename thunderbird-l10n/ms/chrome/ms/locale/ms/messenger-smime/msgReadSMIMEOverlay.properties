ImapOnDemand = Mesej yang dipaparkan telah ditandatangani secara digital, tapi tidak semua lampiran telah dimuat turun. Oleh itu, tandatangan ini tidak boleh disahkan. Klik OK untuk memuat turun mesej secara lengkap dan mengesahkan tandatangan.
CantDecryptTitle = %brand% tidak dapat mengenkrip mesej ini
CantDecryptBody = Pengirim mengenkripsi mesej kepada anda ini menggunakan salah satu daripada sijil digital anda, tapi %brand% tidak dapat mencari sijil ini dan kunci yang berkaitan.<br>Penyelesaian yang boleh dibuat:<br><ul><li>Jika anda ada kad pintar, sila sisipkan sekarang.<li>Jika anda menggunakan mesin yang baru, atau menggunakan profil %brand% baru, anda perlu pulihkan kunci peribadi dan sijil anda daripada sandaran. Sijil sandaran biasanya berakhir dengan ".p12".</ul>\u0020
