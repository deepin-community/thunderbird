formPostSecureToInsecureWarning.title = Sinjalizim Sigurie
formPostSecureToInsecureWarning.message = Të dhënat që keni dhënë në këtë faqe do të dërgohen përmes një lidhjeje jo të siguruar dhe mund të lexohen nga palë të treta.\n\nJeni i sigurt se doni të dërgohen këto të dhëna?
