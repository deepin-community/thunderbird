ImapOnDemand = Mesazhi i shfaqur është nënshkruar numerikisht, por nuk janë shkarkuar ende tërë bashkëngjitjet e tij. Prandaj nuk vleftësohet dot nënshkrimi. Klikoni OK për të shkarkuar mesazhin të plotë dhe vleftësuar nënshkrimin.
CantDecryptTitle = %brand% s’e shfshehtëzon dot këtë mesazh
CantDecryptBody = Dërguesi e ka fshehtëzuar këtë mesazh për ju duke përdorur një nga dëshmitë tuaja shifrore, megjithatë %brand% nuk qe në gjendje ta gjejë këtë dëshmi dhe kyçin privat përkatës. <br> Zgjidhje të mundshme: <br><ul><li>Nëse keni një "smartcard", ju lutemi, futeni tani. <li>Nëse po përdorni një makinë të re, ose po përdorni një profil %brand% të ri, do t’ju duhet të riktheni dëshminë dhe kyçin tuaj privat prej një kopjeruajtjeje. Kopjeruajtjet e dëshmive zakonisht mbarojnë me ".p12".</ul>\u0020
