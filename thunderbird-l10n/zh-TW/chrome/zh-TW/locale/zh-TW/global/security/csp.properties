CSPInlineStyleViolation = 由於違反了下列指示：「%1$S」，此頁面的行內樣式（%2$S）無法套用
CSPROInlineStyleViolation = （Report-Only 政策）由於會違反下列指示：「%1$S」，此頁面的行內樣式（%2$S）將無法套用
CSPInlineScriptViolation = 由於違反了下列指示：「%1$S」，此頁面的行內指令碼（%2$S）無法執行
CSPROInlineScriptViolation = （Report-Only 政策）由於會違反下列指示：「%1$S」，此頁面的行內指令碼（%2$S）將無法執行
CSPEventHandlerScriptViolation = 由於違反了下列指示：「%1$S」，此頁面的 event handler（%2$S）無法執行
CSPROEventHandlerScriptViolation = （Report-Only 政策）由於會違反下列指示：「%1$S」，此頁面的 event handler（%2$S）將無法執行
CSPEvalScriptViolation = 由於違反了下列指示：「%1$S」（缺少 'unsafe-eval'），此頁面的 JavaScript eval（%2$S）無法執行
CSPROEvalScriptViolation = （Report-Only 政策）由於會違反下列指示：「%1$S」（缺少 'unsafe-eval'），此頁面的 JavaScript eval（%2$S）將無法執行
CSPWasmEvalScriptViolation = 由於違反了下列指示：「%1$S」（缺少 'wasm-unsafe-eval' 或 'unsafe-eval'），此頁面的 WebAssembly（%2$S）無法執行
CSPROWasmEvalScriptViolation = （Report-Only 政策）由於會違反下列指示：「%1$S」（缺少 'wasm-unsafe-eval' 或 'unsafe-eval'），此頁面的 WebAssembly（%2$S）將無法執行
CSPTrustedTypesPolicyViolation = 由於頁面設定內容違反下列指示：「%1$S」，無法建立 Trusted Types 原則
CSPROTrustedTypesPolicyViolation = （Report-Only 政策）由於頁面設定內容會違反下列指示：「%1$S」，將無法建立 Trusted Types 原則
CSPTrustedTypesSinkViolation = 由於此頁面的設定違反了「require-trusted-types-for 'script'」指令，導致無法設定 injection sink
CSPROTrustedTypesSinkViolation = （Report-Only 政策）由於此頁面的設定會違反「require-trusted-types-for 'script'」指令，將導致無法設定 injection sink
CSPStyleViolation = 由於違反了下列指示：「%1$S」，位於 %2$S 的行內樣式（%3$S）無法套用
CSPROStyleViolation = （Report-Only 政策）由於會違反下列指示：「%1$S」，位於 %2$S 的行內樣式（%3$S）將無法套用
CSPScriptViolation = 由於違反了下列指示：「%1$S」，位於 %2$S 的行內指令碼（%3$S）無法執行
CSPROScriptViolation = （Report-Only 政策）由於會違反下列指示：「%1$S」，位於 %2$S 的行內指令碼（%3$S）將無法執行
CSPWorkerViolation = 由於違反了下列指示：「%1$S」，位於 %2$S 的 worker 指令碼（%3$S）無法執行
CSPROWorkerViolation = （Report-Only 政策）由於會違反下列指示：「%1$S」，位於 %2$S 的 worker 指令碼（%3$S）將無法執行
CSPGenericViolation = 由於違反了下列指示：「%1$S」，位於 %2$S 的資源（%3$S）無法載入
CSPROGenericViolation = （Report-Only 政策）由於會違反下列指示：「%1$S」，位於 %2$S 的資源（%3$S）將無法載入
triedToSendReport = 嘗試傳送報表至無效 URI:「%1$S」
tooManyReports = 已防止於短時間內送出太多 CSP 回報。
couldNotParseReportURI = 無法剖析回報 URI: %1$S
couldNotProcessUnknownDirective = 無法處理未知指示「%1$S」
ignoringUnknownOption = 忽略未知的選項 %1$S
ignoringDuplicateSrc = 忽略重複的來源 %1$S
ignoringNonAsciiToken = 忽略含有非 ASCII 字元「%2$S」的指令「%1$S」
ignoringSrcFromMetaCSP = 忽略來源「%1$S」（不支援透過 meta 元素提供）。
ignoringSrcWithinNonceOrHashDirective = 忽略 %2$S 當中的「%1$S」：指定了 nonce-source 或 hash-source
ignoringScriptSrcForStrictDynamic = 忽略 %2$S 當中的「%1$S」：指定了「strict-dynamic」
ignoringStrictDynamic = 忽略來源「%1$S」（僅支援來自 script-src 的來源）。
ignoringUnsafeEval = 忽略「%1$S」當中的「unsafe-eval」或「wasm-unsafe-eval」。
strictDynamicButNoHashOrNonce = 「%1$S」當中不含有效 nonce 或雜湊的 ‘strict-dynamic’ 關鍵字可能會封鎖所有指令碼載入
reportURInotHttpsOrHttp2 = 回報網址 (%1$S) 應為 HTTP 或 HTTPS 網址。
reportURINorReportToNotInReportOnlyHeader = 此網站（%1$S）含有 Report-Only 政策卻未指定 report-uri。CSP 將不會封鎖，且無法回報此政策違反。
failedToParseUnrecognizedSource = 無法剖析未知的來源 %1$S
upgradeInsecureRequest = 已將不安全的請求「%1$S」升級使用「%2$S」通訊協定
ignoreSrcForDirective = 忽略「%1$S」指示的 srcs
hostNameMightBeKeyword = 將 %1$S 解譯為主機名稱而非關鍵字。若您刻意要將其設為關鍵字，請改用 '%2$S'（用單引號包起來）。
notSupportingDirective = 不支援指示「%1$S」，將忽略該指示與指示值。
blockAllMixedContent = 封鎖不安全的請求「%1$S」。
ignoringDirectiveWithNoValues = 由於不含任何參數，忽略「%1$S」。
ignoringInvalidGroupSyntax = report-to 指令組「%1$S」的 token「%2$S」無效，將忽略。
ignoringReportOnlyDirective = 在以唯讀政策「%1$S」傳遞時，忽略沙盒指示
IgnoringSrcBecauseOfDirective = 由於有「%2$S」指示，將忽略「%1$S」。
IgnoringSourceWithinDirective = 忽略來源「%1$S」（不支援於「%2$S」當中）。
obsoleteBlockAllMixedContent = 由於升級混和式內容顯示，會造成 block-all-mixed-content 無效，忽略「%1$S」。
couldntParseInvalidSource = 無法剖析無效來源 %1$S
couldntParseInvalidHost = 無法剖析無效主機 %1$S
couldntParsePort = 無法剖析 %1$S 當中的埠號
duplicateDirective = 偵測到重複的 %1$S 指示。將忽略第一個以外的指示。
couldntParseInvalidSandboxFlag = 無法剖析無效的沙盒旗標「%1$S」
invalidNumberOfTrustedTypesForDirectiveValues = 「require-trusted-types-for」指令：%1$S 收到的 token 數量無效，預期收到 1 組。
invalidRequireTrustedTypesForDirectiveValue = 「require-trusted-types-for」指令收到的 token 無效：%1$S，預期應為「script」。
invalidTrustedTypesExpression = 「trusted-types」指令收到的 token 無效：%1$S
CSPMessagePrefix = Content-Security-Policy: %S
