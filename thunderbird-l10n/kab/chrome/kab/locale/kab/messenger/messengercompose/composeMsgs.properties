smtpAuthMechNotSupported = Aqeddac uffiɣ (SMTP) %S ur yettban ara d akken ur yessefrak ara tarrayt n usesteb. Ma ulac aɣilif, ɛreḍ asnifel n 'Tarrayt n usesteb' di 'Iɣewwaṛen n umiḍan | Aqeddac uffiɣ (SMTP)'.
