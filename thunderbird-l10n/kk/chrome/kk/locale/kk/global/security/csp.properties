CSPInlineStyleViolation = Бұл беттің баптаулары кірістірілген стильдің (%2$S) іске асырылуын бұғаттады, өйткені ол келесі директиваны бұзады: "%1$S"
CSPROInlineStyleViolation = (Report-Only саясаты) Бұл беттің баптаулары кірістірілген стильдің (%2$S) іске асырылуын бұғаттайтын болады, өйткені ол келесі директиваны бұзады: "%1$S"
CSPInlineScriptViolation = Бұл беттің баптаулары кірістірілген скрипттің (%2$S) орындалуын бұғаттады, өйткені ол келесі директиваны бұзады: "%1$S"
CSPROInlineScriptViolation = (Report-Only саясаты) Бұл беттің баптаулары кірістірілген скрипттің (%2$S) орындалуын бұғаттайтын болады, өйткені ол келесі директиваны бұзады: "%1$S"
CSPEventHandlerScriptViolation = Бұл беттің баптаулары оқиғаларды өңдеушісінің (%2$S) орындалуын бұғаттады, өйткені ол келесі директиваны бұзады: "%1$S"
CSPROEventHandlerScriptViolation = (Report-Only саясаты) Бұл беттің баптаулары оқиғаларды өңдеушісінің (%2$S) орындалуын бұғаттайтын болады, өйткені ол келесі директиваны бұзады: "%1$S"
CSPEvalScriptViolation = Бұл беттің баптаулары JavaScript eval (%2$S) орындалуын бұғаттады, өйткені ол келесі директиваны бұзады: "%1$S" ('unsafe-eval' жоқ болып тұр)
CSPROEvalScriptViolation = (Report-Only саясаты) Бұл беттің баптаулары JavaScript eval (%2$S) орындалуын бұғаттайтын болады, өйткені ол келесі директиваны бұзады: "%1$S" ('unsafe-eval' жоқ болып тұр)
CSPWasmEvalScriptViolation = Бұл беттің баптаулары WebAssembly (%2$S) орындалуын бұғаттады, өйткені ол келесі директиваны бұзады: "%1$S" ('wasm-unsafe-eval' немесе 'unsafe-eval' жоқ болып тұр)
CSPROWasmEvalScriptViolation = (Report-Only саясаты) Бұл беттің баптаулары WebAssembly (%2$S) орындалуын бұғаттайтын болады, өйткені ол келесі директиваны бұзады: "%1$S" ('wasm-unsafe-eval' немесе 'unsafe-eval' жоқ болып тұр)
CSPTrustedTypesPolicyViolation = Бұл беттің баптаулары Trusted Types саясатын жасауды бұғаттады, өйткені ол келесі директиваны бұзады: "%1$S"
CSPROTrustedTypesPolicyViolation = (Report-Only саясаты) Бұл беттің баптаулары Trusted Types саясатын жасауды бұғаттайтын болады, өйткені ол келесі директиваны бұзады: "%1$S"
CSPTrustedTypesSinkViolation = Бет параметрлері инъекция қабылаушысына тағайындауды бұғаттады, себебі ол келесі директиваны бұзады: “require-trusted-types-for ’script’“
CSPROTrustedTypesSinkViolation = (Report-Only саясаты) Бет параметрлері инъекция қабылаушысына тағайындауды бұғаттайтын болады, себебі ол келесі директиваны бұзады: “require-trusted-types-for ’script’“
CSPStyleViolation = Бұл беттің баптаулары кірістірілген стильдің (%3$S) %2$S жеріндегі іске асырылуын бұғаттады, өйткені ол келесі директиваны бұзады: "%1$S"
CSPROStyleViolation = (Report-Only саясаты) Бұл беттің баптаулары кірістірілген стильдің (%3$S) %2$S жеріндегі іске асырылуын бұғаттайтын болады, өйткені ол келесі директиваны бұзады: "%1$S"
CSPScriptViolation = Бұл беттің баптаулары скрипттің (%3$S) %2$S жеріндегі іске асырылуын бұғаттады, өйткені ол келесі директиваны бұзады: "%1$S"
CSPROScriptViolation = (Report-Only саясаты) Бұл беттің баптаулары скрипттің (%3$S) %2$S жеріндегі іске асырылуын бұғаттайтын болады, өйткені ол келесі директиваны бұзады: "%1$S"
CSPWorkerViolation = Бұл беттің баптаулары worker скриптінің (%3$S) %2$S жеріндегі іске асырылуын бұғаттады, өйткені ол келесі директиваны бұзады: "%1$S"
CSPROWorkerViolation = (Report-Only саясаты) Бұл беттің баптаулары worker скриптінің (%3$S) %2$S жеріндегі іске асырылуын бұғаттайтын болады, өйткені ол келесі директиваны бұзады: "%1$S"
CSPGenericViolation = Бұл беттің баптаулары ресурстың  (%3$S) %2$S жеріндегі жүктелуін бұғаттады, өйткені ол келесі директиваны бұзады: "%1$S"
CSPROGenericViolation = (Report-Only саясаты) Бұл беттің баптаулары ресурстың  (%3$S) %2$S жеріндегі жүктелуін бұғаттайтын болады, өйткені ол келесі директиваны бұзады: "%1$S"
triedToSendReport = Есептемені қате URI-ға жіберу талабы: "%1$S"
tooManyReports = Қысқа уақыт ішінде тым көп CSP есептерінің жіберілуіне жол берілмеді.
couldNotParseReportURI = есептеме URI-ін талдау мүмкін емес: %1$S
couldNotProcessUnknownDirective = Белгісіз "%1$S" директивасын өңдеу мүмкін емес
ignoringUnknownOption = %1$S белгісіз баптауны елемеу
ignoringDuplicateSrc = Қайталанатын %1$S қайнар көзін елемеу
ignoringNonAsciiToken = ASCII-емес "%2$S" токенімен "%1$S" директивасын елемеу
ignoringSrcFromMetaCSP = "%1$S" қайнар көзін елемеу (Мета элемент арқылы жеткізілген кезде оған қолдау жоқ).
ignoringSrcWithinNonceOrHashDirective = %2$S ішінде "%1$S" елемейміз: nonce-source немесе hash-source көрсетілген
ignoringScriptSrcForStrictDynamic = %2$S ішінде "%1$S" елемейміз: "strict-dynamic" көрсетілген
ignoringStrictDynamic = "%1$S" бастапқы кодын елемеу (тек script-src қолдауы бар).
ignoringUnsafeEval = "%1$S" ішіндегі "unsafe-eval" немесе "wasm-unsafe-eval" елемейміз.
strictDynamicButNoHashOrNonce = "%1$S" ішіндегі "strict-dynamic" кілттік сөзі жарамды nonce немесе hash болмаған кезде барлық скрипттер жүктелуін блоктауы мүмкін.
reportURInotHttpsOrHttp2 = Есептеме URI (%1$S) түрі HTTP не HTTPS URI болуы тиіс.
reportURINorReportToNotInReportOnlyHeader = Бұл сайтта (%1$S) report-uri және report-to директивалары жоқ Report-Only саясаты бар. CSP бұл саясаттың бұзылуын блоктамайды және ол туралы хабарлай алмайды.
failedToParseUnrecognizedSource = Танылмаған %1$S қайнар көзін талдау мүмкін емес
upgradeInsecureRequest = Қауіпсіз емес "%1$S" сұранымын "%2$S" қолданатындай етіп жаңарту
ignoreSrcForDirective = "%1$S" директивасы үшін srcs елемеу
hostNameMightBeKeyword = %1$S хостнейм, кілт сөзі емес ретінде талдау. Егер осыны кілт сөз болуды қаласаңыз, '%2$S' қолданыңыз (дара тырнақшаға алынған).
notSupportingDirective = "%1$S" директивасына қолдау жоқ. Директива мен оның мәндерін елемейміз.
blockAllMixedContent = "%1$S" қауіпсіз емес сұранымды блоктау.
ignoringDirectiveWithNoValues = "%1$S" елемеу, өйткені оның құрамында параметрлер жоқ.
ignoringInvalidGroupSyntax = Ignoring report-to directive group ‘%1$S’ with invalid token ‘%2$S’.
ignoringReportOnlyDirective = Тек-есептеме "%1$S" саясаты ішінде жеткізілген құмсалғыш директивасын елемеу.
IgnoringSrcBecauseOfDirective = "%2$S" директивасы салдарынан "%1$S" елемейміз.
IgnoringSourceWithinDirective = "%1$S" бастапқы кодын елемеу ("%2$S" ішінде қолдау жоқ).
obsoleteBlockAllMixedContent = "%1$S" елемеу, өйткені аралас мазмұнды көрсетуді жаңарту block-all-mixed-content опциясын ескірген етеді.
couldntParseInvalidSource = Қате қайнар көзін талдау мүмкін емес: %1$S
couldntParseInvalidHost = Қате %1$S хостын талдау мүмкін емес
couldntParsePort = %1$S ішіндегі портты талдау мүмкін емес
duplicateDirective = Қайталанатын %1$S директивалары анықталған.  Бірінші нұсқадан басқа барлық нұсқалар ескерілмейді.
couldntParseInvalidSandboxFlag = "%1$S" құмсалғыштың жарамсыз жалаушасын талдау мүмкін емес.
invalidNumberOfTrustedTypesForDirectiveValues = "require-trusted-types-for" директивасы үшін токендердің жарамсыз саны алынды: %1$S; 1 күтілген
invalidRequireTrustedTypesForDirectiveValue = "require-trusted-types-for" директивасы үшін жарамсыз токен алынды: %1$S; "script" күтілген
invalidTrustedTypesExpression = ‘trusted-types‘ директивасы үшін жарамсыз токен алынды: %1$S
CSPMessagePrefix = Content-Security-Policy: %S
