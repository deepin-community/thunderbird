CSPInlineScriptViolation = ページの設定によりインラインスクリプト (%2$S) の実行をブロックしました。次のディレクティブに違反しています: “%1$S”
CSPROInlineScriptViolation = (Report-Only ポリシー) ページの設定によりインラインスクリプト (%2$S) の実行がブロックされます。次のディレクティブに違反しています: “%1$S”
