ImapOnDemand = ข้อความที่แสดงมีการลงลายเซ็นแบบดิจิทัล แต่ยังไม่ได้ดาวน์โหลดสิ่งที่แนบมาทั้งหมด จึงไม่สามารถตรวจสอบความถูกต้องของลายเซ็นดังกล่าวได้ คลิก ตกลง เพื่อดาวน์โหลดข้อความที่สมบูรณ์และตรวจสอบความถูกต้องของลายเซ็น
CantDecryptTitle = %brand% ไม่สามารถถอดรหัสลับข้อความนี้
CantDecryptBody = ผู้ส่งเข้ารหัสลับข้อความนี้ถึงคุณโดยใช้ใบรับรองดิจิทัลของคุณ อย่างไรก็ตาม %brand% ไม่สามารถหาใบรับรองนี้และกุญแจส่วนตัวที่เกี่ยวข้องได้ <br> วิธีแก้ปัญหาที่เป็นไปได้: <br><ul><li>หากคุณมีสมาร์ทการ์ด โปรดใส่สมาร์ทการ์ดของคุณตอนนี้ <li>หากคุณใช้เครื่องใหม่ หรือหากคุณใช้โปรไฟล์ %brand% ใหม่ คุณจะต้องเรียกคืนใบรับรองและกุญแจส่วนตัวจากการสำรองข้อมูล การสำรองข้อมูลใบรับรองมักจะลงท้ายด้วย ".p12"</ul>
