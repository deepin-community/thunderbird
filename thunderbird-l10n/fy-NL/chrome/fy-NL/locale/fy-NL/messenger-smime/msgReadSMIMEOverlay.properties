ImapOnDemand = It toande berjocht is digitaal ûndertekene, mar noch net alle bylagen binne download. Dêrtroch kin de ûndertekening net falidearre wurde. Klik op OK om it hiele berjocht te downloaden en de ûndertekening te falidearjen.
CantDecryptTitle = %brand% kin dit berjocht net ûntsiferje
CantDecryptBody = De ôfstjoerder hat dit berjocht fersifere mei help fan ien fan jo digitale sertifikaten, mar %brand% koe dit sertifikaat en de derby hearrende priveekaai net fine. <br>Mooglike oplossingen: <br><ul><li>As jo in smartcard hawwe, pleats dy dan no. <li>As jo in nije masine of in nij %brand%-profyl brûke moatte jo it sertifikaat en de priveekaai tebeksette fan in reservekopy. Reservekopyën fan sertifikaten einigje meast op ‘.p12’..</ul>\u0020
