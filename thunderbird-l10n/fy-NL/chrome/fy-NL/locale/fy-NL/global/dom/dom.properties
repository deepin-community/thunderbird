ImportMapAddressNotEndsWithSlash = Der is in ûnjildich adres opjûn foar de spesifikaasjekaai ‘%1$S’; omdat ‘%1$S’ einiget mei in slash, moat it adres ‘%2$S’ dat ek dwaan.
