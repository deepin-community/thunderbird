ImportMapResolveInvalidBareSpecifierWarnRelative = De spesifikator ‘%S’ wie in basis spesifikator, mar waard net opnij oan wat oars tafoege. Relative modulespesifikators moatte begjinne mei ‘./’, ‘../’ of ‘/’.
