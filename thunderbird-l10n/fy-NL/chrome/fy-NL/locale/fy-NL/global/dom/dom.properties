ImportMapResolutionBlockedByAfterPrefix = Resolúsje fan spesifikaasje ‘%S’ is blokkearre, omdat de subtekenreeks nei it foarfoegsel net ûntlede wurde koe as in URL neffens it adres yn de ymportkaart.
