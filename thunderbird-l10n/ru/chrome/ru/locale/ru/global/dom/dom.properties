WindowContentUntrustedWarning = Атрибут ‘content’ объекта Window является устаревшим.  Пожалуйста, используйте вместо него ‘window.top’.
SVGRefLoopWarning = SVG <%S> с идентификатором «%S» имеет цикл ссылок.
