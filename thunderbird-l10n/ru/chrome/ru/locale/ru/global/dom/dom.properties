ModuleResolveFailureNoWarn = Ошибка разрешения спецификатора модуля «%S».
ModuleResolveFailureWarnRelative = Ошибка разрешения спецификатора модуля «%S». Связанные спецификаторы модуля должны начинаться с «./», «../» или «/».
