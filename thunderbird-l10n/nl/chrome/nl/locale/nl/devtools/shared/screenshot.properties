screenshotDesc = Een afbeelding van de pagina opslaan
screenshotFilenameDesc = Naam van doelbestand
screenshotFilenameManual = De naam van het bestand (dient een ‘.png’-extensie te hebben) waarnaar de schermafbeelding wordt geschreven.
screenshotClipboardDesc = Schermafbeelding naar klembord kopiëren? (true/false)
screenshotClipboardManual = True als u de schermafbeelding wilt kopiëren in plaats van opslaan naar een bestand.
screenshotGroupOptions = Opties
screenshotDelayDesc = Vertraging (seconden)
screenshotDelayManual = De tijd die moet worden gewacht (in seconden) voordat de schermafbeelding wordt gemaakt
screenshotDPRDesc = Pixelverhouding van apparaat
screenshotDPRManual = De te gebruiken pixelverhouding van het apparaat bij maken van de schermafbeelding
screenshotFullPageDesc = Hele webpagina? (true/false)
screenshotFullPageManual = True als de schermafbeelding ook onderdelen van de webpagina moet bevatten die buiten de huidige scrollgrenzen vallen.
screenshotFileDesc = Opslaan naar bestand? (true/false)
screenshotFileManual = True als de schermafbeelding het bestand ook moet opslaan wanneer andere opties zijn ingeschakeld (bv. het klembord).
screenshotGeneratedFilename = Schermafbeelding %1$S om %2$S
screenshotErrorSavingToFile = Fout bij opslaan naar %1$S
screenshotSavedToFile = Opgeslagen naar %1$S
screenshotErrorCopying = Fout bij kopiëren van schermafbeelding naar klembord.
screenshotCopied = Schermafbeelding naar klembord gekopieerd.
inspectNodeDesc = CSS-selector
inspectNodeManual = Een CSS-selector voor het gebruik met document.querySelector, die één element identificeert
screenshotTruncationWarning = De afbeelding is bijgesneden tot %1$Sx%2$S omdat de resulterende afbeelding te groot was
screenshotDPRDecreasedWarning = De pixelverhouding van het apparaat is teruggebracht tot 1 omdat de resulterende afbeelding te groot was
screenshotRenderingError = Fout bij het maken van de afbeelding. De resulterende afbeelding was waarschijnlijk te groot.
screenshotNoSelectorMatchWarning = De selector ‘%S’ komt met geen enkel element op de pagina overeen.
