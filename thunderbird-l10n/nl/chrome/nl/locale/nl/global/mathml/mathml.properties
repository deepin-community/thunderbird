InvalidChild = Ongeldige opmaak: <%1$S> is niet toegestaan als een onderliggend item van <%2$S>.
ChildCountIncorrect = Ongeldige opmaak: onjuist aantal onderliggende items voor <%1$S/>-tag.
DuplicateMprescripts = Ongeldige opmaak: meer dan één <mprescripts/> in <mmultiscripts/>.
NoBase = Ongeldige opmaak: exact één Base-element in <mmultiscripts/> verwacht. Geen gevonden.
SubSupMismatch = Ongeldige opmaak: onvolledig subscript/superscript-paar in <mmultiscripts/>.
AttributeParsingError = Fout tijdens het parsen van waarde ‘%1$S’ voor ‘%2$S’-attribuut van <%3$S/>. Attribuut genegeerd.
AttributeParsingErrorNoTag = Fout tijdens het parsen van waarde ‘%1$S’ voor ‘%2$S’-attribuut. Attribuut genegeerd.
LengthParsingError = Fout tijdens het parsen van MathML-attribuutwaarde ‘%1$S’ als lengte. Attribuut genegeerd.
