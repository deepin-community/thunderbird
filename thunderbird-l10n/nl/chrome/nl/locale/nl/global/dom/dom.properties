MediaEMEInsecureContextDeprecatedWarning = Gebruik van Encrypted Media Extensions op %S op een onveilige (m.a.w. niet-HTTPS-)context wordt niet meer ondersteund en zal binnenkort worden verwijderd. Overweeg het gebruik van een veilige oorsprong, zoals HTTPS.
MediaEMENoCapabilitiesDeprecatedWarning = Het aanroepen van navigator.requestMediaKeySystemAccess() (op %S) zonder doorgeven van een kandidaat MediaKeySystemConfiguration die audioCapabilities of videoCapabilities bevat, is verouderd en wordt binnenkort niet meer ondersteund.
MediaEMENoCodecsDeprecatedWarning = Het aanroepen van navigator.requestMediaKeySystemAccess() (op %S) zonder doorgeven van een kandidaat MediaKeySystemConfiguration die audioCapabilities of videoCapabilities bevat zonder een contentType met een ‘codecs’-string, is verouderd en wordt binnenkort niet meer ondersteund.
DOMAttrModifiedWarning = Toevoegen van een listener voor DOMAttrModified wordt niet meer ondersteund en zal binnenkort worden verwijderd. In plaats van een MutationEvent kunt u MutationObserver gebruiken. https://developer.mozilla.org/docs/Web/API/MutationObserver
DOMCharacterDataModifiedWarning = Toevoegen van een listener voor DOMCharacterDataModified is verouderd en zal binnenkort worden verwijderd. In plaats van een MutationEvent kunt u MutationObserver gebruiken. https://developer.mozilla.org/docs/Web/API/MutationObserver
DOMNodeInsertedWarning = Het toevoegen van een listener voor DOMNodeInserted wordt niet meer ondersteund en zal binnenkort worden verwijderd. In plaats van een MutationEvent kunt u MutationObserver gebruiken. https://developer.mozilla.org/docs/Web/API/MutationObserver
DOMNodeInsertedIntoDocumentWarning = Toevoegen van een listener voor DOMNodeInsertedIntoDocument wordt niet meer ondersteund en zal binnenkort worden verwijderd. In plaats van een MutationEvent kunt u MutationObserver gebruiken. https://developer.mozilla.org/docs/Web/API/MutationObserver
DOMNodeRemovedWarning = Toevoegen van een listener voor DOMNodeRemoved wordt niet meer ondersteund en zal binnenkort worden verwijderd. In plaats van een MutationEvent kunt u MutationObserver gebruiken. https://developer.mozilla.org/docs/Web/API/MutationObserver
DOMNodeRemovedFromDocumentWarning = Toevoegen van een listener voor DOMNodeRemovedFromDocument wordt niet meer ondersteund en zal binnenkort worden verwijderd. In plaats van een MutationEvent kunt u MutationObserver gebruiken. https://developer.mozilla.org/docs/Web/API/MutationObserver
DOMSubtreeModifiedWarning = Toevoegen van een listener voor DOMSubtreeModified is verouderd en zal binnenkort worden verwijderd. In plaats van een MutationEvent kunt u MutationObserver gebruiken. https://developer.mozilla.org/docs/Web/API/MutationObserver
BlockAutoplayError = Automatisch afspelen is alleen toegestaan wanneer goedgekeurd door de gebruiker, de website is geactiveerd door de gebruiker, of media wordt gedempt.
BlockAutoplayWebAudioStartError = Automatisch starten van een AudioContext is verhinderd. Deze moet worden aangemaakt of hervat na een beweging van de gebruiker op de pagina.
ComponentsWarning = Het Components-object wordt niet meer ondersteund. Het zal binnenkort worden verwijderd.
PluginHangUITitle = Waarschuwing: plug-in reageert niet
PluginHangUIMessage = %S is bezig, of het reageert niet meer. U kunt de plug-in nu stoppen, of u kunt verdergaan om te zien of de werking van de plug-in zal worden voltooid.
