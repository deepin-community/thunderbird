CSPInlineStyleViolation = 由于违反了下列指令：“%1$S”，此页面的内联样式（%2$S）无法应用
CSPROInlineStyleViolation = （“仅作上报”策略）由于违反了下列指令：“%1$S”，此页面的内联样式（%2$S）无法应用
CSPInlineScriptViolation = 由于违反了下列指令：“%1$S”，此页面的内联脚本（%2$S）无法执行
CSPROInlineScriptViolation = （“仅作上报”策略）由于违反了下列指令：“%1$S”，此页面的内联脚本（%2$S）无法执行
CSPEventHandlerScriptViolation = 由于违反了下列指令：“%1$S”，此页面的事件句柄（%2$S）无法执行
CSPROEventHandlerScriptViolation = （“仅作上报”策略）由于违反了下列指令：“%1$S”，此页面的事件句柄（%2$S）无法执行
CSPEvalScriptViolation = 由于违反了下列指令：“%1$S”（缺少”unsafe-eval“），此页面的 JavaScript eval（%2$S）无法执行
CSPROEvalScriptViolation = （“仅作上报”策略）由于违反了下列指令：“%1$S”（缺少”unsafe-eval“），此页面的 JavaScript eval（%2$S）无法执行
CSPWasmEvalScriptViolation = 由于违反了下列指令：“%1$S”（缺少”wasm-unsafe-eval“或”unsafe-eval“），此页面的 WebAssembly（%2$S）无法执行
CSPROWasmEvalScriptViolation = （“仅作上报”策略）由于违反了下列指令：“%1$S”（缺少”wasm-unsafe-eval“或”unsafe-eval“），此页面的 WebAssembly（%2$S）无法执行
CSPTrustedTypesPolicyViolation = 由于违反下列指令：“%1$S”，此页面的设置阻止了 Trusted Types 策略的创建。
CSPROTrustedTypesPolicyViolation = （Report-Only 策略）由于违反了下列指令：“%1$S”，此页面的设置将阻止创建 Trusted Types 策略
CSPTrustedTypesSinkViolation = 由于违反了下列指令：“require-trusted-types-for ’script’”，此页面的设置阻止了分配注入池的操作
CSPROTrustedTypesSinkViolation = （Report-Only 策略）由于违反了下列指令：“require-trusted-types-for ’script’”，此页面的设置将阻止分配注入池的操作
CSPStyleViolation = 由于违反了下列指令：“%1$S”，此页面来自 %2$S 的样式（%3$S）无法应用
CSPROStyleViolation = （“仅作上报”策略）由于违反了下列指令：“%1$S”，此页面来自 %2$S 的样式（%3$S）无法应用
CSPScriptViolation = 由于违反了下列指令：“%1$S”，此页面来自 %2$S 的脚本（%3$S）无法执行
CSPROScriptViolation = （“仅作上报”策略）由于违反了下列指令：“%1$S”，此页面来自 %2$S 的脚本（%3$S）无法执行
CSPWorkerViolation = 由于违反了下列指令：“%1$S”，此页面来自 %2$S 的 worker 脚本（%3$S）无法执行
CSPROWorkerViolation = （“仅作上报”策略）由于违反了下列指令：“%1$S”，此页面来自 %2$S 的 worker 脚本（%3$S）无法执行
CSPGenericViolation = 由于违反了下列指令：“%1$S”，此页面位于 %2$S 的资源（%3$S）无法加载
CSPROGenericViolation = （“仅作上报”策略）由于违反了下列指令：“%1$S”，此页面位于 %2$S 的资源（%3$S）无法加载
triedToSendReport = 试图发送报告到无效的 URI：“%1$S”
tooManyReports = 已阻止在短时间内发送过多 CSP 报告。
couldNotParseReportURI = 无法解析报告的 URI：%1$S
couldNotProcessUnknownDirective = 不能处理未知的指令“%1$S”
ignoringUnknownOption = 将忽略未知选项 %1$S
ignoringDuplicateSrc = 将忽略重复的来源 %1$S
ignoringNonAsciiToken = 将忽略带有非 ASCII 标记“%2$S”的指令“%1$S”
ignoringSrcFromMetaCSP = 忽略源 '%1$S' (通过 meta 元素传递时不支持)。
ignoringSrcWithinNonceOrHashDirective = 忽略 %2$S 中的 “%1$S”：指定了 nonce-source 或 hash-source
ignoringScriptSrcForStrictDynamic = 忽略 %2$S 中的“%1$S”：指定了“strict-dynamic”
ignoringStrictDynamic = 忽略来源“%1$S”（仅 script-src 内可支持）。
ignoringUnsafeEval = 忽略“%1$S”中的“unsafe-eval”或“wasm-unsafe-eval”。
strictDynamicButNoHashOrNonce = “%1$S”内的关键字 ‘strict-dynamic’ 没有有效的随机数或散列，可能阻止加载所有脚本
reportURInotHttpsOrHttp2 = 报告 URI（%1$S）应为 HTTP 或 HTTPS URI。
reportURINorReportToNotInReportOnlyHeader = 此网站（%1$S）采用 Report-Only 策略，但未指定 report-uri 或 report-to 指令。CSP 将不会阻止且无法报告此策略的违反情况。
failedToParseUnrecognizedSource = 解析不可识别的来源 %1$S 失败
upgradeInsecureRequest = 将升级不安全的请求“%1$S”至使用“%2$S”
ignoreSrcForDirective = 将根据指令 ‘%1$S’ 忽略 src
hostNameMightBeKeyword = %1$S 被识别为主机名而不是关键词。如果您想将其识别为关键词，应使用 ‘%2$S’（用单引号括起来）。
notSupportingDirective = 不支持指令 ‘%1$S’。指令和值将被忽略。
blockAllMixedContent = 将拦截不安全的请求 ‘%1$S’。
ignoringDirectiveWithNoValues = 将忽略 ‘%1$S‘，因为它未包含任何参数。
ignoringInvalidGroupSyntax = 将忽略带有无效令牌“%2$S”的 report-to 指令组“%1$S”。
ignoringReportOnlyDirective = 在提供有 report-only 策略 ‘%1$S’ 时忽略沙盒指令
IgnoringSrcBecauseOfDirective = 将因 ‘%2$S’ 指令忽略 ‘%1$S’。
IgnoringSourceWithinDirective = 将忽略来源“%1$S”（“%2$S”中不支持）。
obsoleteBlockAllMixedContent = 将忽略“%1$S”。因为在升级混合内容显示后，block-all-mixed-content 已过时。
couldntParseInvalidSource = 无法解析无效的源 %1$S
couldntParseInvalidHost = 不能解析无效的主机 %1$S
couldntParsePort = 不能解析 %1$S 中的端口
duplicateDirective = 检测到重复的指令 %1$S。将忽略除首个指令外的其他指令。
couldntParseInvalidSandboxFlag = 无法解析无效的沙盒标识“%1$S”
invalidNumberOfTrustedTypesForDirectiveValues = 收到“require-trusted-types-for”指令的无效令牌数量：%1$S，需要为 1
invalidRequireTrustedTypesForDirectiveValue = 收到“require-trusted-types-for”指令的无效令牌：%1$S，需要为“script”
invalidTrustedTypesExpression = 收到“trusted-types”指令的无效令牌：%1$S
CSPMessagePrefix = Content-Security-Policy：%S
