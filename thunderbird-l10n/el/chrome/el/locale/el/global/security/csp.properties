strictDynamicButNoHashOrNonce = Η λέξη-κλειδί «strict-dynamic» εντός του «%1$S» χωρίς έγκυρο nonce ή hash ενδέχεται να αποκλείσει τη φόρτωση όλων των σεναρίων
