couldNotGetSendersIdentity = Συνέβη ένα σφάλμα κατά την αποστολή του μηνύματος: η ταυτότητα του αποστολέα δεν ήταν έγκυρη. Επιβεβαιώστε την παραμετροποίηση της ταυτότητάς σας και δοκιμάστε πάλι.
