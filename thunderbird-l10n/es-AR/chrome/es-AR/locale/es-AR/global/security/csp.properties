CSPInlineStyleViolation = La configuración de la página bloqueó la aplicación de un estilo inline (%2$S) porque viola la siguiente directiva: “%1$S”
CSPROInlineStyleViolation = (Política Report-Only) La configuración de la página bloquearía la aplicación de un estilo inline (%2$S) porque viola la siguiente directiva: “%1$S”
CSPInlineScriptViolation = La configuración de la página bloqueó la ejecución de un script inline (%2$S) porque viola la siguiente directiva: “%1$S”
CSPROInlineScriptViolation = (Política Report-Only) La configuración de la página bloquearía la ejecución de un script inline (%2$S) porque viola la siguiente directiva: “%1$S”
CSPEventHandlerScriptViolation = La configuración de la página bloqueó la ejecución de un event handler (%2$S) porque viola la siguiente directiva: “%1$S”
CSPROEventHandlerScriptViolation = (Política Report-Only) La configuración de la página bloquearía la ejecución de un event handler (%2$S) porque viola la siguiente directiva: “%1$S”
CSPEvalScriptViolation = La configuración de la página bloqueó la ejecución de JavaScript eval (%2$S) porque viola la siguiente directiva: “%1$S” (Falta 'unsafe-eval')
CSPROEvalScriptViolation = (Política Report-Only) La configuración de la página bloquearía la ejecución de JavaScript eval (%2$S) porque viola la siguiente directiva: “%1$S” (Falta 'unsafe-eval')
CSPWasmEvalScriptViolation = La configuración de la página bloqueó la ejecución de WebAssembly (%2$S) porque viola la siguiente directiva: “%1$S” (Falta 'wasm-unsafe-eval' o 'unsafe-eval')
CSPROWasmEvalScriptViolation = (Política Report-Only) La configuración de la página bloquearía la ejecución de WebAssembly (%2$S) porque viola la siguiente directiva: “%1$S” (Falta 'wasm-unsafe-eval' o 'unsafe-eval')
CSPTrustedTypesPolicyViolation = La configuración de la página bloqueó crear una política Trusted Types porque viola la siguiente directiva: “%1$S”
CSPROTrustedTypesPolicyViolation = (Política Report-only) La configuración de la página bloquearía crear una política Trusted Types porque viola la siguiente directiva: “%1$S”
CSPTrustedTypesSinkViolation = La configuración de la página bloqueó la asignación a un injection sink porque viola la siguiente directiva: “require-trusted-types-for ’script’“
CSPROTrustedTypesSinkViolation = (Política Report-Only) La configuración de la página bloquearía la asignación a un injection sink porque viola la siguiente directiva: “require-trusted-types-for ’script’“
CSPStyleViolation = La configuración de la página bloqueó la aplicación de un estilo (%3$S) en %2$S porque viola la siguiente directiva: “%1$S”
CSPROStyleViolation = (Política Report-Only) La configuración de la página bloquearía la aplicación de un estilo (%3$S) en %2$S porque viola la siguiente directiva: “%1$S”
CSPScriptViolation = La configuración de la página bloqueó la ejecución de un script (%3$S) en %2$S porque viola la siguiente directiva: “%1$S”
CSPROScriptViolation = (Política Report-Only) La configuración de la página bloquearía la ejecución de un script (%3$S) en %2$S porque viola la siguiente directiva: “%1$S”
CSPWorkerViolation = La configuración de la página bloqueó la ejecución de un worker script (%3$S) en %2$S porque viola la siguiente directiva: “%1$S”
CSPROWorkerViolation = (Política Report-Only) La configuración de la página bloquearía la ejecución de un worker script (%3$S) en %2$S porque viola la siguiente directiva: “%1$S”
CSPGenericViolation = La configuración de la página bloqueó la carga de un recurso (%3$S) en %2$S porque viola la siguiente directiva: “%1$S”
CSPROGenericViolation = (Política Report-Only) La configuración de la página bloquearía la carga de un recurso (%3$S) en %2$S porque viola la siguiente directiva: “%1$S”
triedToSendReport = Se trató de enviar informe a URI inválido: "%1$S"
tooManyReports = Se evitó que se enviaran demasiados informes de CSP en un período corto de tiempo.
couldNotParseReportURI = couldn't parse report URI: %1$S
couldNotProcessUnknownDirective = No se puede procesar directiva desconocida '%1$S'
ignoringUnknownOption = Ignorando opción desconocida %1$S
ignoringDuplicateSrc = Ignorando fuente duplicada %1$S
ignoringNonAsciiToken = Ignorar la directiva '%1$S' con el token que no es ASCII '%2$S'
ignoringSrcFromMetaCSP = Ignorando fuente '%1$S' (No soportado al enviar vía elemento meta).
ignoringSrcWithinNonceOrHashDirective = Ignorar "%1$S" dentro de %2$S: se especificó fuente nonce o hash-source
ignoringScriptSrcForStrictDynamic = Ignorar "%1$S" dentro de %2$S: 'estricto-dinámico'
ignoringStrictDynamic = Ingorando fuente “%1$S” (Solo soportado dentro de script-src).
ignoringUnsafeEval = Ignorar 'unsafe-eval' o 'wasm-unsafe-eval' dentro de "%1$S".
strictDynamicButNoHashOrNonce = Palabra clave ‘strict-dynamic’ dentro de “%1$S” sin nonce o hash válidos puede bloquear toda la carga de scripts
reportURInotHttpsOrHttp2 = La URI del informe (%1$S) debería ser HTTP o HTTPS.
reportURINorReportToNotInReportOnlyHeader = Este sitio (%1$S) tiene una política Report-Only sin directiva report-uri ni una directiva report-to. CSP no bloqueará y no puede informar violaciones de esta política.
failedToParseUnrecognizedSource = Failed to parse unrecoginzied source %1$S
upgradeInsecureRequest = Actualizando pedido inseguro '%1$S' para usar '%2$S'
ignoreSrcForDirective = Ignorando srcs para directiva '%1$S'
hostNameMightBeKeyword = Interpretando %1$S como un nombre de servidor, no una palabra clave. Si pretende que sea una palabra clave, use '%2$S' (encerrado en comillas simples).
notSupportingDirective = Directiva '%1$S' no soportada. La directiva y los valores serán ignorados.
blockAllMixedContent = Bloqueando pedido inseguro ‘%1$S’.
ignoringDirectiveWithNoValues = Ignorando ‘%1$S‘ porque no contiene ningún parámetro.
ignoringInvalidGroupSyntax = Ignorando el grupo de directivas report-to ‘%1$S’ con token inválido ‘%2$S’.
ignoringReportOnlyDirective = Ignorando directiva de entorno de prueba al enviarse en una política report-only ‘%1$S’
IgnoringSrcBecauseOfDirective = Ignorando ‘%1$S’ por la directiva ‘%2$S’.
IgnoringSourceWithinDirective = Ignorar fuente “%1$S” (no compatible dentro de ‘%2$S’).
obsoleteBlockAllMixedContent = Ignorando ‘%1$S’ porque la actualización de muestra de contenido mezclado hace obsoleto block-all-mixed-content.
couldntParseInvalidSource = Couldn't parse invalid source %1$S
couldntParseInvalidHost = Couldn't parse invalid host %1$S
couldntParsePort = Couldn't parse port in %1$S
duplicateDirective = Se detectaron directivas %1$S duplicadas.  Salvo la primera instancia, se ignorarán las demás.
couldntParseInvalidSandboxFlag = Couldn’t parse invalid sandbox flag ‘%1$S’
invalidNumberOfTrustedTypesForDirectiveValues = Se recibió un número inválido de tokens para la directiva ‘required-trusted-types-for‘: %1$S; se esperaba 1
invalidRequireTrustedTypesForDirectiveValue = Se recibió un token inválido para la directiva ‘required-trusted-types-for‘: %1$S; se esperaba ‘script‘
invalidTrustedTypesExpression = Se recibió un token inválido para la directiva ‘trusted-types‘: %1$S
CSPMessagePrefix = Content-Security-Policy: %S
