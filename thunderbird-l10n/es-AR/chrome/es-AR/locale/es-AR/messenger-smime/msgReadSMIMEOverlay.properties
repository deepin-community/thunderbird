ImapOnDemand = El mensaje mostrado fue firmado digitalmente, pero no todos sus adjuntos fueron descargados aún. Pulse Aceptar para descargar el mensaje completo y validar la firma.
CantDecryptTitle = %brand% no puede descifrar este mensaje
CantDecryptBody = El remitente cifró este mensaje usando uno de sus certificados digitales, sin embargo, %brand% no pudo encontrar el certificado y su correspondiente clave privada. <br> Posibles soluciones: <br><ul><li>Si tiene una smartcard, insértela ahora. <li>Si está usando una nueva máquina, o si está usando un nuevo perfil de %brand%, necesitará restaurar sus certificados y clave privada desde un backup. Backups de certificados usualmente terminan en ".p12".</ul>\u0020
