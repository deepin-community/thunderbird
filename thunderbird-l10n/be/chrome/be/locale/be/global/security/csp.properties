CSPInlineStyleViolation = Налады старонкі заблакавалі прымяненне ўбудаванага стылю (%2$S), таму што ён парушае наступную дырэктыву: «%1$S»
CSPROInlineStyleViolation = (Палітыка Report-Only) Налады старонкі будуць блакаваць прымяненне ўбудаванага стылю (%2$S), таму што ён парушае наступную дырэктыву: «%1$S»
CSPInlineScriptViolation = Налады старонкі заблакавалі выкананне ўбудаванага сцэнарыя (%2$S), таму што ён парушае наступную дырэктыву: «%1$S»
CSPROInlineScriptViolation = (Палітыка Report-Only) Налады старонкі будуць блакаваць выкананне ўбудаванага скрыпта (%2$S), таму што ён парушае наступную дырэктыву: «%1$S»
CSPEventHandlerScriptViolation = Налады старонкі заблакавалі выкананне апрацоўшчыка падзеі (%2$S), таму што ён парушае наступную дырэктыву: «%1$S»
CSPROEventHandlerScriptViolation = (Палітыка Report-Only) Налады старонкі будуць блакаваць выкананне апрацоўшчыка падзеі (%2$S), таму што ён парушае наступную дырэктыву: «%1$S»
CSPEvalScriptViolation = Налады старонкі заблакавалі выкананне JavaScript eval (%2$S), таму што ён парушае наступную дырэктыву: «%1$S» (адсутнічае 'unsafe-eval')
CSPROEvalScriptViolation = (Палітыка Report-Only) Налады старонкі будуць блакаваць выкананне JavaScript eval (%2$S), таму што ён парушае наступную дырэктыву: «%1$S» (адсутнічае 'unsafe-eval')
CSPWasmEvalScriptViolation = Налады старонкі заблакавалі выкананне WebAssembly (%2$S), таму што ён парушае наступную дырэктыву: «%1$S» (адсутнічае 'wasm-unsafe-eval' або 'unsafe-eval')
CSPROWasmEvalScriptViolation = (Палітыка Report-Only) Налады старонкі будуць блакаваць выкананне WebAssembly (%2$S), таму што ён парушае наступную дырэктыву: «%1$S» (адсутнічае 'wasm-unsafe-eval' або 'unsafe-eval')
CSPTrustedTypesPolicyViolation = Налады старонкі заблакавалі стварэнне палітыкі давераных тыпаў, таму што яна парушае наступную дырэктыву: «%1$S»
CSPROTrustedTypesPolicyViolation = (Палітыка Report-Only) Налады старонкі будуць блакаваць стварэнне палітыкі давераных тыпаў, таму што яна парушае наступную дырэктыву: «%1$S»
CSPTrustedTypesSinkViolation = Налады старонкі заблакавалі прызначэнне прыёмніку ін'екцый, таму што гэта парушае наступную дырэктыву: «require-trusted-types-for ’script’»
CSPROTrustedTypesSinkViolation = (Палітыка Report-Only) Налады старонкі будуць блакаваць прызначэнне прыёмніку ін'екцый, таму што гэта парушае наступную дырэктыву: «require-trusted-types-for ’script’»
CSPStyleViolation = Налады старонкі заблакавалі прымяненне стылю (%3$S) на %2$S, таму што ён парушае наступную дырэктыву: «%1$S»
CSPROStyleViolation = (Палітыка Report-Only) Налады старонкі будуць блакаваць прымяненне стылю (%3$S) на %2$S, таму што ён парушае наступную дырэктыву: «%1$S»
CSPScriptViolation = Налады старонкі заблакавалі выкананне сцэнарыя (%3$S) на %2$S, таму што ён парушае наступную дырэктыву: «%1$S»
CSPROScriptViolation = (Палітыка Report-Only) Налады старонкі будуць блакаваць выкананне скрыпта (%3$S) на %2$S, таму што ён парушае наступную дырэктыву: «%1$S»
CSPWorkerViolation = Налады старонкі заблакавалі выкананне worker-скрыпта (%3$S) на %2$S, таму што ён парушае наступную дырэктыву: «%1$S»
CSPROWorkerViolation = (Палітыка Report-Only) Налады старонкі будуць блакаваць выкананне worker-скрыпта (%3$S) на %2$S, таму што ён парушае наступную дырэктыву: «%1$S»
CSPGenericViolation = Налады старонкі заблакавалі загрузку рэсурсу (%3$S) на %2$S, таму што гэта парушае наступную дырэктыву: «%1$S»
CSPROGenericViolation = (Палітыка Report-Only) Налады старонкі будуць блакаваць загрузку рэсурсу (%3$S) на %2$S, таму што гэта парушае наступную дырэктыву: «%1$S»
triedToSendReport = Спроба даслаць справаздачу на няспраўны URI: "%1$S"
tooManyReports = Прадухілена адпраўка занадта вялікай колькасці справаздач CSP за кароткі прамежак часу.
couldNotParseReportURI = немагчыма разабраць URI справаздачы: %1$S
couldNotProcessUnknownDirective = Немагчыма апрацаваць невядомую дырэктыву '%1$S'
ignoringUnknownOption = Невядомае наладжванне %1$S ігнаруецца
ignoringDuplicateSrc = Ігнаруецца дублікатная крыніца %1$S
ignoringNonAsciiToken = Ігнараванне дырэктывы «%1$S» з токенам, адрозным ад ASCII, «%2$S»
ignoringSrcFromMetaCSP = Ігнаруецца крыніца ‘%1$S’ (Не падтрымліваецца, калі прадстаўлена праз мета-элемент).
ignoringSrcWithinNonceOrHashDirective = Ігнаруецца “%1$S” у межах %2$S: указаны nonce-source або hash-source
ignoringScriptSrcForStrictDynamic = Ігнаруецца “%1$S” унутры %2$S: зададзены ‘strict-dynamic’
ignoringStrictDynamic = Ігнаруецца крыніца “%1$S” (Падтрымліваецца толькі ўнутры script-src).
ignoringUnsafeEval = Ігнаруецца ‘unsafe-eval’ або ‘wasm-unsafe-eval’ унутры “%1$S”.
strictDynamicButNoHashOrNonce = Ключавое слова ‘strict-dynamic’ унутры “%1$S” з невалідным nonce або hash можа заблакаваць загрузку ўсіх скрыптаў
reportURInotHttpsOrHttp2 = URI справаздачы (%1$S) павінна быць URI HTTP ці HTTPS.
reportURINorReportToNotInReportOnlyHeader = Гэты сайт (%1$S) мае палітыку Report-Only без дырэктыў report-uri або report-to. CSP не будзе блакаваць і не здолее паведамляць пра парушэнні гэтай палітыкі.
failedToParseUnrecognizedSource = Няўдача разбору нераспазнанага зыходніка %1$S
upgradeInsecureRequest = Абнаўляецца не бяспечны запыт ‘%1$S’ для выкарыстання ‘%2$S’
ignoreSrcForDirective = Ігнаруюцца srcs для дырэктывы ‘%1$S’
hostNameMightBeKeyword = %1$S тлумачыцца як назва трымальніка, не як ключавое слова. Калі вы мелі намер ужыць ключавое слова, вазьміце яго ў коскі, напрыклад: '%2$S'.
notSupportingDirective = Непадтрыманая дырэктыва ‘%1$S’. Дырэктыва і значэнні будуць праігнараваны.
blockAllMixedContent = Заблакаваны не бяспечны запыт ‘%1$S’.
ignoringDirectiveWithNoValues = Ігнаруецца ‘%1$S’, бо не ўтрымлівае ніякіх параметраў.
ignoringInvalidGroupSyntax = Ігнаруецца група дырэктыў report-to «%1$S» з некарэктным токенам «%2$S».
ignoringReportOnlyDirective = Ігнаруецца дырэктыва пясочніцы, калі прадстаўлена ў палітыцы ‘%1$S’ толькі для справаздачы
IgnoringSrcBecauseOfDirective = Ігнараванне ‘%1$S’ з-за дырэктывы ‘%2$S’.
IgnoringSourceWithinDirective = Ігнаруецца крыніца “%1$S” (Не падтрымліваецца ў ‘%2$S’).
obsoleteBlockAllMixedContent = Ігнаруецца ‘%1$S’, бо абнаўленне адлюстравання змешанага змесціва робіць block-all-mixed-content састарэлым.
couldntParseInvalidSource = Немагчыма разабраць няспраўны зыходнік %1$S
couldntParseInvalidHost = Немагчыма разабраць няспраўны трымальнік %1$S
couldntParsePort = Немагчыма разабраць порт у %1$S
duplicateDirective = Выяўлены падвойныя дырэктывы %1$S. Усе асобнікі, акрамя першага, будуць ігнаравацца.
couldntParseInvalidSandboxFlag = Немагчыма разабраць недапушчальны сцяг пясочніцы ‘%1$S’
invalidNumberOfTrustedTypesForDirectiveValues = Атрымана недапушчальная колькасць токенаў для дырэктывы ‘require-trusted-types-for‘: %1$S; чакаецца 1
invalidRequireTrustedTypesForDirectiveValue = Атрыманы недапушчальны токен для дырэктывы ‘require-trusted-types-for‘: %1$S; чакаецца ‘script‘
invalidTrustedTypesExpression = Атрыманы недапушчальны токен для дырэктывы ‘trusted-types‘: %1$S
CSPMessagePrefix = Content-Security-Policy: %S
