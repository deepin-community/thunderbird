0 = Праблема прадвызначэння LDAP
1 = Не атрымалася злучыцца з LDAP-серверам
2 = Не атрымалася злучыцца з LDAP-серверам
3 = Праблема сувязі з LDAP-серверам
4 = Праблема пошуку на LDAP-серверы
errorAlertFormat = Код памылкі %1$S: %2$S\n\n %3$S
5000 = Трымальнік не знойдзены
9999 = Невядомая памылка
10003 = Паспрабуйце зноў пазней, або звяжыцеся з вашым Сістэмным Адміністратарам.
10008 = Моцнае апазнаванне зараз не падтрымліваецца.
10021 = Упэўніцеся, што вы ўвялі правільны фільтр пошуку і паспрабуйце зноў, або звярніцеся да вашага сістэмнага адміністратара. Для праверкі фільтра пошуку, перайдзіце ў меню «Праўка» — «Перавагі» — «Пошта і групы навін» — «Адрасаванне», націсніце «Рэдагаваць каталогі», выберыце выкарыстоўваемы LDAP-сервер і націсніце «Рэдагаваць» — «Пашыраныя налады».
10032 = Упэўніцеся, што вы ўвялі правільнае імя каранёвага элемента (Base DN) і паспрабуйце зноў, або звярніцеся да вашага сістэмнага адміністратара. Для праверкі каранёвага элемента (Base DN), перайдзіце ў меню «Праўка» — «Перавагі» — «Пошта і групы навін» — «Адрасаванне», націсніце «Рэдагаваць каталогі», выберыце выкарыстоўваемы LDAP-сервер і націсніце «Рэдагаваць».
10051 = Паспрабуйце пазней, калі ласка.
10081 = Verify that the Hostname and Port Number are correct, and then try again, or else contact your System Administrator. To verify that the Hostname and Port Number are correct, from the Edit menu, choose Preferences, then choose Mail & Newsgroups, and then choose Addressing. Click Edit Directories, and select the LDAP server being used. Click Edit to display the Hostname. Click Advanced to display the Port Number.
10085 = Паспрабуйце пазней, калі ласка.
10087 = Упэўніцеся, што вы ўвялі правільны фільтр пошуку і паспрабуйце зноў, або звярніцеся да вашага сістэмнага адміністратара. Для праверкі фільтра пошуку, перайдзіце ў меню «Праўка» — «Перавагі» — «Пошта і групы навін» — «Адрасаванне», націсніце «Рэдагаваць каталогі», выберыце выкарыстоўваемы LDAP-сервер і націсніце «Рэдагаваць» — «Пашыраныя налады».
10090 = Please close some other windows and/or applications and try again.
10091 = Verify that the Hostname and Port Number are correct, and then try again, or else contact your System Administrator. To verify that the Hostname and Port Number are correct, from the Edit menu, choose Preferences, then choose Mail & Newsgroups, and then choose Addressing. Click Edit Directories, and select the LDAP server being used. Click Edit to display the Hostname. Click Advanced to display the Port Number.
15000 = Verify that the Hostname is correct, and then try again, or else contact your System Administrator. To verify that the Hostname is correct, from the Edit menu, choose Preferences, then choose Mail & Newsgroups, and then choose Addressing. Click Edit Directories, and select the LDAP server being used. Click Edit to display the Hostname.
19999 = Звяжыцеся, калі ласка, з вашым сістэмным адміністратарам.
