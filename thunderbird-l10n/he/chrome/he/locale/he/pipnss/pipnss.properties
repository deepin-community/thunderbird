UserCertIgnoredNoPrivateKey = אישור אישי זה לא ניתן להתקנה מכיוון שאין ברשותך את המפתח הפרטי התואם שנוצר כאשר האישור נדרש.
UserCertImported = האישור האישי שלך הותקן. כדאי שתעשה עותק גיבוי של אישור זה.
