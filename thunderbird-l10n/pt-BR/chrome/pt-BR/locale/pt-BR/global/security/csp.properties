CSPInlineStyleViolation = As configurações da página bloquearam a aplicação de um estilo inline (%2$S) porque viola a seguinte diretiva: “%1$S”
CSPROInlineStyleViolation = (diretiva Report-Only) As configurações da página podem impedir a aplicação de um estilo inline (%2$S) porque viola a seguinte diretiva: “%1$S”
CSPInlineScriptViolation = As configurações da página bloquearam a execução de um script inline (%2$S) porque viola a seguinte diretiva: “%1$S”
CSPROInlineScriptViolation = (diretiva Report-Only) As configurações da página podem impedir a execução de um script inline (%2$S) porque viola a seguinte diretiva: “%1$S”
CSPEventHandlerScriptViolation = As configurações da página bloquearam a execução de um manipulador de eventos (%2$S) porque viola a seguinte diretiva: “%1$S”
CSPROEventHandlerScriptViolation = (diretiva Report-Only) As configurações da página podem impedir a execução de um manipulador de eventos (%2$S) porque viola a seguinte diretiva: “%1$S”
CSPEvalScriptViolation = As configurações da página bloquearam a execução de um 'eval' JavaScript (%2$S) porque viola a seguinte diretiva: “%1$S” (não tem 'unsafe-eval')
CSPROEvalScriptViolation = (diretiva Report-Only) As configurações da página podem impedir a execução de um 'eval' JavaScript (%2$S) porque viola a seguinte diretiva: “%1$S” (não tem 'unsafe-eval')
CSPWasmEvalScriptViolation = As configurações da página bloquearam a execução de WebAssembly (%2$S) porque viola a seguinte diretiva: “%1$S” (não tem 'wasm-unsafe-eval' ou 'unsafe-eval')
CSPROWasmEvalScriptViolation = (diretiva Report-Only) As configurações da página podem impedir a execução de WebAssembly (%2$S) porque viola a seguinte diretiva: “%1$S” (não tem 'wasm-unsafe-eval' ou 'unsafe-eval')
CSPTrustedTypesPolicyViolation = A configuração da página bloqueou a criação de uma diretiva Trusted Types porque ela viola a seguinte diretiva: “%1$S“
CSPROTrustedTypesPolicyViolation = (diretiva Report-Only) As configurações da página podem impedir a criação de uma diretiva Trusted Types  porque ela viola a seguinte diretiva: “%1$S“
CSPTrustedTypesSinkViolation = As configurações da página bloquearam a atribuição de um “injection sink“ porque viola a seguinte diretiva: “require-trusted-types-for ’script’“
CSPROTrustedTypesSinkViolation = (diretiva Report-Only) As configurações da página podem impedir a atribuição de um “injection sink“ porque viola a seguinte diretiva: “require-trusted-types-for ’script’“
CSPStyleViolation = As configurações da página bloquearam a aplicação de um estilo (%3$S) em %2$S porque viola a seguinte diretiva: “%1$S”
CSPROStyleViolation = (diretiva Report-Only) As configurações da página podem impedir a aplicação de um estilo (%3$S) em %2$S porque viola a seguinte diretiva: “%1$S”
CSPScriptViolation = As configurações da página bloquearam a execução de um script (%3$S) em %2$S porque viola a seguinte diretiva: “%1$S”
CSPROScriptViolation = (diretiva Report-Only) As configurações da página podem impedir a execução de um script (%3$S) em %2$S porque viola a seguinte diretiva: “%1$S”
CSPWorkerViolation = As configurações da página bloquearam a execução de um worker script (%3$S) em %2$S porque viola a seguinte diretiva: “%1$S”
CSPROWorkerViolation = (diretiva Report-Only) As configurações da página podem impedir a execução de um worker script (%3$S) em %2$S porque viola a seguinte diretiva: “%1$S”
CSPGenericViolation = As configurações da página bloquearam o carregamento de um recurso (%3$S) em %2$S porque viola a seguinte diretiva: “%1$S”
CSPROGenericViolation = (diretiva Report-Only) As configurações da página podem impedir o carregamento de um recurso (%3$S) em %2$S porque viola a seguinte diretiva: “%1$S”
triedToSendReport = Tentou enviar relato para uma URI inválida: “%1$S”
tooManyReports = Impediu que relatórios CSP demais fossem enviados em um curto período de tempo.
couldNotParseReportURI = não foi possível parsear a URI do relatório: %1$S
couldNotProcessUnknownDirective = Não foi possível processar a diretiva desconhecida “%1$S”
ignoringUnknownOption = Ignorando opção desconhecida %1$S
ignoringDuplicateSrc = Ignorando fonte duplicada %1$S
ignoringNonAsciiToken = Ignorando diretiva ‘%1$S’ com o token não ASCII ‘%2$S’
ignoringSrcFromMetaCSP = Ignorando a fonte '%1$S' (não suportado quando entregue via elemento meta).
ignoringSrcWithinNonceOrHashDirective = Ignorando “%1$S” em %2$S: Especificado 'nonce-source' ou 'hash-source'
ignoringScriptSrcForStrictDynamic = Ignorando “%1$S” em %2$S: Especificado ‘strict-dynamic’
ignoringStrictDynamic = Ignorar código “%1$S” (Suportado somente com script-src).
ignoringUnsafeEval = Ignorando ‘unsafe-eval’ ou ‘wasm-unsafe-eval’ dentro de “%1$S”.
strictDynamicButNoHashOrNonce = A palavra-chave ‘strict-dynamic’ dentro de “%1$S” sem nonce ou hash válido pode bloquear o carregamento de todos os scripts
reportURInotHttpsOrHttp2 = A URI do relatório (%1$S) deve uma URI HTTP ou HTTPS.
reportURINorReportToNotInReportOnlyHeader = Este site (%1$S) tem uma diretiva Report-Only sem diretiva report-uri nem diretiva report-to. A CSP não irá bloquear e não pode relatar violações desta diretiva.
failedToParseUnrecognizedSource = Falha ao parsear origem não reconhecida %1$S
upgradeInsecureRequest = Trocando requisição não segura '%1$S' para usar '%2$S'
ignoreSrcForDirective = Ignorando fontes da diretiva '%1$S'
hostNameMightBeKeyword = Interpretando %1$S como nome de servidor, não uma palavra-chave. Se sua intenção era usar como palavra-chave, use '%2$S' (entre aspas simples).
notSupportingDirective = Directiva não suportada “%1$S”. Diretiva e valores serão ignorados.
blockAllMixedContent = Bloqueando solicitação não segura '%1$S'.
ignoringDirectiveWithNoValues = Ignorando ‘%1$S’, pois não contém nenhum parâmetro.
ignoringInvalidGroupSyntax = Ignorado grupo ‘%1$S’ de diretiva 'report-to' com token ‘%2$S’ inválido.
ignoringReportOnlyDirective = Ignorando a diretiva de isolamento (sandbox) quando entregue em uma diretiva report-only '%1$S'
IgnoringSrcBecauseOfDirective = Ignorando ‘%1$S’ por causa da directiva ‘%2$S’.
IgnoringSourceWithinDirective = Ignorando fonte “%1$S” (não suportado dentro de ‘%2$S’).
obsoleteBlockAllMixedContent = Ignorando ‘%1$S’ porque a mudança na exibição de conteúdo misto torna block-all-mixed-content obsoleto.
couldntParseInvalidSource = Não foi possível parsear origem inválida %1$S
couldntParseInvalidHost = Não foi possível parsear servidor inválido %1$S
couldntParsePort = Não foi possível parsear porta em %1$S
duplicateDirective = Detectadas diretivas %1$S duplicadas. Serão ignoradas todas as instâncias com exceção da primeira.
couldntParseInvalidSandboxFlag = Não foi possível parsear flag de isolamento (sandbox) inválido '%1$S'
invalidNumberOfTrustedTypesForDirectiveValues = Recebido um número inválido de tokens para a diretiva ‘require-trusted-types-for‘: %1$S (esperado apenas 1)
invalidRequireTrustedTypesForDirectiveValue = Recebido um token inválido para a diretiva ‘require-trusted-types-for‘: %1$S (esperado ‘script‘)
invalidTrustedTypesExpression = Recebido um token inválido para a diretiva ‘trusted-types‘: %1$S
CSPMessagePrefix = Content-Security-Policy: %S
